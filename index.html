<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Zaphira — Dashboard Ventas</title>
<base target="_top">
<style>
:root{
 --surface-2:#ffffff;--surface-1:#f5f6f8;--surface-0:#eef0f3;
 --text-primary:#17202e;--text-secondary:#54606f;--text-muted:#8a94a1;
 --border:#e0e4ea;--fill-primary:#1e3a6e;--on-primary:#ffffff;
 --text-accent:#1e3a6e;--bg-accent:#e8edf7;
 --text-success:#2f7d4f;--bg-success:#e8f3ec;
 --text-warning:#8a6a1f;--bg-warning:#f6efd9;
 --text-danger:#b23b3b;--bg-danger:#f8e9e9;
 --text-neutral:#6b7480;--bg-neutral:#eceef1;
 --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root{
 --r:12px;--r-sm:8px;--ctl-h:36px;
 --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
 --ring:0 0 0 3px rgba(30,58,110,.25);
}
*{box-sizing:border-box}
/* El atributo hidden lo pisa cualquier regla con display (ej. .fl{display:flex}): sin esto,
   los campos Desde/Hasta quedan visibles aunque el período no sea "rango a medida". */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- header ---------- */
header{min-height:68px;background:#17233b;color:#fff;padding:11px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{background:#fff;border-radius:var(--r-sm);padding:6px 11px;display:inline-flex;align-items:center;line-height:0;flex:none}
.brand img{height:26px;width:auto;display:block}
.title-block{min-width:0}
.title-block strong{display:block;font-size:14px;font-weight:650;color:#fff}
.title-block span{display:block;margin-top:2px;font-size:11px;color:#9db4dd}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px;min-width:0}
.sync-status{display:flex;align-items:center;gap:9px;color:#9db4dd;font-size:11px;text-align:right;white-space:nowrap}
.sync-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#efcb71;box-shadow:0 0 0 4px rgba(239,203,113,.12)}
.sync-dot.ok{background:#70bf8c;box-shadow:0 0 0 4px rgba(112,191,140,.12)}
.sync-dot.error{background:#d98978;box-shadow:0 0 0 4px rgba(217,137,120,.12)}
#fresh{color:inherit;line-height:1.5}
.loading-card{margin-top:20px;display:flex;align-items:center;gap:13px}
.loading-spinner{width:19px;height:19px;flex:none;border:2px solid #d7dfeb;border-top-color:var(--fill-primary);border-radius:50%;animation:spin .8s linear infinite}
.loading-card h3{margin-bottom:3px}
.loading-detail{font-size:11.5px;color:var(--text-muted)}
@keyframes spin{to{transform:rotate(360deg)}}
footer.made{padding:18px 22px;text-align:center;font-size:11px;letter-spacing:.4px;color:var(--text-muted)}
footer.made b{color:var(--text-secondary);font-weight:600}

/* ---------- barra de controles ---------- */
.bar2{position:sticky;top:0;z-index:20;background:var(--surface-2);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:10px 20px}
.tbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.tgroup{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;flex:1;min-width:0}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl>label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ctl{font-family:inherit;font-size:13px;height:var(--ctl-h);padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-primary);min-width:152px;max-width:100%}
select.ctl{padding-right:30px;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='none' stroke='%238a94a1' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round' d='M3 4.5 6 7.5 9 4.5'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:12px}
input[type=date].ctl{-webkit-appearance:none;appearance:none;min-width:150px}
.ctl:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--fill-primary)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;height:var(--ctl-h);flex:none}
.seg button{border:0;background:var(--surface-2);color:var(--text-secondary);font-family:inherit;font-size:13px;font-weight:600;padding:0 16px;cursor:pointer}
.seg button.on{background:var(--fill-primary);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctl-h);padding:0 13px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-secondary);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-1);color:var(--text-primary)}
.btn:disabled{opacity:.55;cursor:progress}
.btn svg{width:14px;height:14px;flex:none}
.btn--quiet{border-color:transparent;background:none;color:var(--text-accent)}
.btn--quiet:hover{background:var(--bg-accent);color:var(--text-accent)}
.actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.ftoggle{display:none;position:relative}
.fdot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--fill-primary);color:#fff;font-size:10px;line-height:16px;text-align:center}

/* ---------- contenido ---------- */
.wrap{display:flex;justify-content:center;padding:20px 18px 60px}
.mk{width:100%;max-width:1040px}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.bdg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;line-height:1.5}
.periodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 13px;margin-bottom:12px}
.periodbar svg{width:15px;height:15px;color:var(--text-muted);flex:none}
.periodbar b{color:var(--text-primary)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:6px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;min-width:0}
.kv{font-size:21px;font-weight:600;margin-top:4px;overflow-wrap:anywhere;line-height:1.2}
.kl{font-size:12px;color:var(--text-secondary);line-height:1.35;min-height:32px}
.ks{font-size:11px;color:var(--text-muted);margin-top:3px}
h3{font-size:15px;font-weight:600;margin:0 0 10px}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.secn{font-size:12px;font-weight:700;color:var(--on-primary);background:var(--fill-primary);border-radius:6px;padding:2px 8px;min-width:26px;text-align:center;flex:none}
.sect{font-size:16px;font-weight:600}
.duo{display:flex;gap:12px;flex-wrap:wrap}
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.legend .sw--line{width:17px;height:3px;border-radius:2px}
.bar{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.barfill{width:70%;border-radius:6px 6px 2px 2px;background:var(--fill-primary);opacity:.85}
.blbl{font-size:10.5px;color:var(--text-muted)}
.bval{font-size:10.5px;color:var(--text-secondary);font-weight:600}
.hrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) max-content;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.hlbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{background:var(--surface-1);border-radius:4px;height:12px;width:100%}
.hbar{height:12px;border-radius:4px;background:var(--fill-primary);opacity:.8;min-width:2px}
.hval{white-space:nowrap;color:var(--text-secondary);font-size:11.5px;text-align:right}
.pend{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 10px,var(--surface-1) 10px,var(--surface-1) 20px)}
.pmsg{font-size:12.5px;color:var(--text-secondary);line-height:1.55}
code{background:var(--surface-1);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:11.5px}

/* ---------- login ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--surface-0);display:flex;align-items:center;justify-content:center;padding:24px}
.gcard{width:100%;max-width:352px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:26px 24px;box-shadow:0 10px 34px rgba(16,24,40,.09)}
.gcard h1{font-size:18px;font-weight:600;margin:14px 0 4px}
.gcard .sub{font-size:12.5px;color:var(--text-secondary);margin-bottom:20px;line-height:1.5}
.gcard label{display:block;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px}
.gcard .ctl{width:100%;min-width:0;height:40px;margin-bottom:14px}
.gcard .btn{width:100%;height:40px;background:var(--fill-primary);color:#fff;border-color:var(--fill-primary);font-size:13.5px}
.gcard .btn:hover{background:#182f59;color:#fff}
.gerr{font-size:12.5px;color:var(--text-danger);background:var(--bg-danger);border-radius:var(--r-sm);padding:8px 11px;margin-bottom:14px;line-height:1.45}
.gnote{font-size:11px;color:var(--text-muted);margin-top:18px;line-height:1.5;text-align:center}
.gsel{display:flex;gap:8px;margin-bottom:18px}
.gopt{flex:1;min-width:0;text-align:center;font-family:inherit;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-sm);padding:13px 10px;cursor:pointer}
.gopt b{display:block;font-size:14px;font-weight:600;color:var(--text-primary)}
.gopt:hover{background:var(--surface-1)}
.gopt.on{border-color:var(--fill-primary);background:var(--bg-accent)}
.gopt.on b{color:var(--text-accent)}
.gopt:focus-visible{outline:none;box-shadow:var(--ring)}
/* El logo es azul oscuro: necesita fondo claro para leerse (el header lo pone sobre blanco). */
.gbrand{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;display:inline-flex;line-height:0}
.gbrand img{height:24px;width:auto;display:block}
#who{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#9db4dd}
#who b{color:#fff;font-weight:600}
#chgpwd{background:none;border:1px solid #3a4a68;color:#9db4dd;font-family:inherit;font-size:11.5px;border-radius:var(--r-sm);padding:3px 9px;cursor:pointer;margin-right:6px}
#chgpwd:hover{background:#22314f;color:#fff}
.ofila{display:grid;grid-template-columns:minmax(140px,200px) 1fr;gap:10px;align-items:center;margin-bottom:8px}
.ofila label{font-size:13px;color:var(--text-muted)}
.ofila .ctl{width:100%}
.ohint{font-size:11px;color:var(--text-muted);margin-top:3px;font-variant-numeric:tabular-nums}
.altaform{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 20px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:6px 10px 6px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 10px 9px 0;border-bottom:1px solid var(--border);vertical-align:top}
.objbar{margin-top:6px}
.objtrack{background:var(--surface-1);border-radius:5px;height:14px;overflow:hidden}
.objfill{height:14px;border-radius:5px;transition:width .4s ease}
@media (max-width:560px){.ofila{grid-template-columns:1fr;gap:4px}}
#logout{background:none;border:1px solid #3a4a68;color:#9db4dd;font-family:inherit;font-size:11.5px;border-radius:var(--r-sm);padding:4px 10px;cursor:pointer}
#logout:hover{background:#22314f;color:#fff}

.period-select{min-width:190px}
.perdates{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.perdates .ctl{min-width:142px}

/* ---------- variación (delta) ---------- */
.dlt{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;white-space:nowrap;line-height:1.5}
.dlt--up{background:var(--bg-success);color:var(--text-success)}
.dlt--dn{background:var(--bg-danger);color:var(--text-danger)}
.dlt--flat{background:var(--bg-neutral);color:var(--text-neutral)}
.kpi .dlt{margin-top:5px}
.cmpnote{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5}

/* ---------- tabla de evolución mes a mes ---------- */
.evo{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
/* La tabla ocupa el ancho del contenedor y las columnas de mes se reparten el sobrante en partes
   iguales: con pocos meses no queda apretada contra la izquierda dejando un hueco, y a medida que
   se suman meses cada columna se achica sola. El `width:1%` de la primera columna es el truco que
   la deja tomar sólo lo que necesita el rótulo; el resto del ancho va a los meses.
   Cuando ya no entran (muchos meses en pantalla chica) el nowrap impide que se compriman más allá
   de lo legible y aparece el scroll horizontal del contenedor. */
.evo table{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%;table-layout:auto}
.evo th,.evo td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border)}
.evo th{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.evo th:first-child,.evo td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-2);font-weight:600;padding-left:0;width:1%;padding-right:18px}
.evo tbody tr:last-child td{border-bottom:0}
.evo tr.tot td{font-weight:700;border-top:2px solid var(--border);color:var(--text-primary)}
.evo .cellv{display:block}
.evo .celld{display:block;font-size:10px;font-weight:700;margin-top:2px}
.evo .up{color:var(--text-success)}
.evo .dn{color:var(--text-danger)}
.evo .flat{color:var(--text-muted)}
.evo .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

@media print{
 header,.bar2{display:none!important}
 #gate{display:none!important}
 .evo{overflow-x:visible}
 .evo th:first-child,.evo td:first-child{position:static}
 body{background:#fff}
 .wrap{padding:0}
 .mk{max-width:none}
 /* Nada de tarjetas, gráficos ni filas partidas entre hojas… */
 .card,.periodbar,.kpis,.duo,.chartbox,.hrow,.legend,svg{break-inside:avoid;page-break-inside:avoid}
 /* …y ningún título huérfano al pie de una hoja, separado de su contenido. */
 .sec,h3{break-after:avoid;page-break-after:avoid;break-inside:avoid}
 .sec{margin-top:14px}
 .periodbar{border:0;padding:0 0 10px}
 *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 @page{size:A4 landscape;margin:11mm}
}

/* ---------- tablet ---------- */
@media (max-width:900px){
 .hrow{grid-template-columns:minmax(0,120px) minmax(0,1fr) max-content;gap:8px}
 .header-right{gap:10px}
}

/* ---------- mobile: filtros colapsables ---------- */
@media (max-width:760px){
 .bar2{padding:9px 14px}
 .ftoggle{display:inline-flex}
 .tbar{gap:10px;align-items:center}
 /* flex:0 0 100% (y no sólo width) para que el panel baje a su propia fila: con el flex:1 de la
    regla base, flex-basis:0% mandaba y el panel se acomodaba al lado del bloque Moneda/Filtros. */
 .tgroup{display:none;flex:0 0 100%;width:100%;flex-direction:column;align-items:stretch;gap:12px;margin-top:4px;padding-top:12px;border-top:1px solid var(--border)}
 .tgroup.open{display:flex}
 .tgroup .ctl{width:100%;min-width:0;height:42px}
 .tgroup .fl{width:100%}
 .actions{margin-left:0;width:100%;flex-wrap:wrap}
 .actions .btn{flex:1 1 auto;height:42px}
 .seg button{padding:0 14px}
 header{padding:10px 14px;gap:11px}
 .title-block{display:none}
 .header-right{margin-left:auto;gap:9px}
 .sync-status{font-size:10.5px}
 #who>span{display:none}
 #chgpwd{display:none}
 .wrap{padding:14px 12px 44px}
 .sec{margin:22px 2px 10px}
 .sect{font-size:15px}
 .perdates{width:100%;align-items:stretch}
 .perdates .fl{flex:1 1 140px}
}

/* ---------- teléfono ---------- */
@media (max-width:480px){
 .bar{overflow-x:auto;-webkit-overflow-scrolling:touch;height:140px}
 .barcol{flex:1 0 46px}
 .bval,.blbl{white-space:nowrap}
 .hrow{grid-template-columns:minmax(0,34vw) minmax(0,1fr) max-content;gap:7px;font-size:11.5px}
 .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
 .kv{font-size:19px}
 .chartbox svg{width:760px;max-width:none}
 .duo{gap:10px}
 .donut3{flex:0 0 108px;width:108px!important;height:108px!important}
}
</style>
</head>

<script type="module">
/* Frontend GitHub Pages. Los datos ya NO se piden con ?data=1 (que devolvía el dataset entero a
   cualquiera): se piden por POST con el token de la sesión, y el backend los manda recortados.
   type="module" habilita await top-level: todo lo de abajo corre recién con la sesión resuelta. */
const EXEC_URL='https://script.google.com/macros/s/AKfycbxkBFVGB9x-Z1VDpONduRf2VruGhQdkl4-F3fNEMCLluZhbyU3nt2rSdyp9Rbu0pWhs/exec';
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let CUR='ARS';
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d;};

/* ===== ACCESO ============================================================================
   Cada vendedora entra con su usuario y ve SÓLO sus ventas. El recorte lo hace el servidor:
   el dataset que llega al navegador ya viene filtrado, y el diccionario de vendedoras trae
   únicamente su nombre. Dirección entra con su propio usuario y ve todo.

   Acá no hay ninguna contraseña ni hash: los usuarios viven en la planilla del backend. Este
   archivo es público (GitHub Pages) y no tiene que contener nada secreto.

   Contraseña inicial genérica + cambio obligatorio en el primer ingreso; los reseteos los hace
   Dirección desde Configuración. La sesión dura 12 h y la marca el token, no el navegador. */

/* POST con Content-Type text/plain a propósito: con application/json el navegador manda antes un
   preflight OPTIONS, y Apps Script no lo contesta — el pedido moriría sin llegar al servidor.
   El cuerpo sigue siendo JSON; lo único que cambia es el rótulo. */
async function api(op,extra,timeoutMs){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs||45000);
  try{
    const r=await fetch(EXEC_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({op},extra||{})),
      cache:'no-store',signal:controller.signal
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{ clearTimeout(timer); }
}

const SES_KEY='zaphira_sesion_v2';
function sesionGuardar(s){ try{localStorage.setItem(SES_KEY,JSON.stringify(s));}catch(e){} }
function sesionLeer(){
  try{
    const s=JSON.parse(localStorage.getItem(SES_KEY)||'null');
    return (s&&s.token)?s:null;    // el vencimiento lo valida el servidor, no el navegador
  }catch(e){ return null; }
}
function sesionBorrar(){ try{localStorage.removeItem(SES_KEY);}catch(e){} }
const DATA_CACHE_PREFIX='zaphira_data_v1_';
const dataCacheKey=u=>DATA_CACHE_PREFIX+String((u&&u.usuario)||'').toLowerCase();
function dataCacheLeer(u){
  try{
    const item=JSON.parse(localStorage.getItem(dataCacheKey(u))||'null');
    return item&&item.response&&item.response.ok?item:null;
  }catch(e){ return null; }
}
function dataCacheGuardar(u,response){
  try{ localStorage.setItem(dataCacheKey(u),JSON.stringify({saved:Date.now(),response})); }catch(e){}
}
function dataCacheBorrar(u){ try{localStorage.removeItem(dataCacheKey(u));}catch(e){} }
function loadingState(title,detail){
  const t=document.getElementById('loadingTitle'),d=document.getElementById('loadingDetail');
  if(t) t.textContent=title;
  if(d) d.textContent=detail;
}
function syncState(text,tone){
  document.getElementById('fresh').textContent=text;
  const dot=document.getElementById('syncDot');
  dot.classList.toggle('ok',tone==='ok');
  dot.classList.toggle('error',tone==='error');
}

let USER=null;
let OBJETIVO={mes:'',empresa:0,mio:0,vendedoras:{}};
const esDireccion =()=>!!USER&&USER.rol==='direccion';
const esVendedora =()=>!!USER&&USER.rol==='vendedora';
/* El ranking y la conversión por vendedora son los dos paneles que comparan compañeras entre sí:
   los ve sólo Dirección. Una vendedora ya recibe el dataset con una sola persona adentro. */
const veComparativaEntreVendedoras=()=>esDireccion();

const LOGO=()=>document.querySelector('.brand img').src;
function pintarSesion(){
  const w=document.getElementById('who');
  w.hidden=!USER;
  if(USER){
    document.getElementById('whoN').textContent=USER.nombre||USER.usuario;
    document.getElementById('headerSubtitle').textContent=esDireccion()?'Dirección · gestión comercial':'Ventas · gestión comercial';
  }
}

/* Cáscara común de las pantallas a pantalla completa (login y cambio de clave). */
function gate(html){
  const g=document.getElementById('gate');
  g.hidden=false; g.innerHTML=html;
  return id=>document.getElementById(id);
}
function cerrarGate(){
  const g=document.getElementById('gate');
  g.hidden=true; g.innerHTML='';
}

/* Pantalla de login. Resuelve con la sesión cuando entra; nunca rechaza (reintenta en su lugar).
   No se ofrece una lista de usuarios: publicar quién tiene acceso no le sirve a quien entra y sí
   a quien no debería. */
function pedirLogin(msg){
  const $=gate(`<form class="gcard" id="gform" autocomplete="on">
     <span class="gbrand"><img src="${LOGO()}" alt="Zaphira Uniformes"></span>
     <h1>Dashboard Ventas</h1>
     <div class="sub">Entrá con tu usuario.</div>
     <div id="gerr">${msg?`<div class="gerr">${msg}</div>`:''}</div>
     <label for="gu">Usuario</label>
     <input class="ctl" id="gu" name="username" autocomplete="username" required>
     <label for="gp">Contraseña</label>
     <input class="ctl" id="gp" name="password" type="password" autocomplete="current-password" required>
     <button class="btn" type="submit" id="gbtn">Entrar</button>
   </form>`);
  setTimeout(()=>$('gu').focus(),40);

  return new Promise(resolve=>{
    $('gform').addEventListener('submit',async e=>{
      e.preventDefault();
      const btn=$('gbtn'); btn.disabled=true; btn.textContent='Verificando…';
      let r;
      try{ r=await api('login',{u:$('gu').value.trim().toLowerCase(),p:$('gp').value}); }
      catch(err){ r={ok:false,error:'No pudimos conectarnos. Revisá tu conexión y probá de nuevo.'}; }
      if(!r||!r.ok){
        $('gerr').innerHTML=`<div class="gerr">${(r&&r.error)||'No pudimos validar el usuario.'}</div>`;
        $('gp').value=''; $('gp').focus();
        btn.disabled=false; btn.textContent='Entrar'; return;
      }
      const ses={token:r.token,usuario:r.usuario,nombre:r.nombre,rol:r.rol,ven:r.vendedora,cambiar:r.cambiar};
      sesionGuardar(ses); cerrarGate(); resolve(ses);
    });
  });
}

/* Cambio de contraseña. Se usa para el primer ingreso obligatorio y también desde el header.
   `obligatorio` saca el botón de cancelar: en el primer ingreso no hay salida más que cambiarla. */
function pedirCambioClave(ses,obligatorio){
  const $=gate(`<form class="gcard" id="cform" autocomplete="off">
     <span class="gbrand"><img src="${LOGO()}" alt="Zaphira Uniformes"></span>
     <h1>${obligatorio?'Elegí tu contraseña':'Cambiar contraseña'}</h1>
     <div class="sub">${obligatorio
       ? 'Estás entrando con la contraseña inicial. Poné una propia para seguir.'
       : 'Vas a tener que volver a entrar con la nueva.'}</div>
     <div id="cerr"></div>
     <label for="c0">Contraseña actual</label>
     <input class="ctl" id="c0" type="password" autocomplete="current-password" required>
     <label for="c1">Contraseña nueva</label>
     <input class="ctl" id="c1" type="password" autocomplete="new-password" required minlength="8">
     <label for="c2">Repetila</label>
     <input class="ctl" id="c2" type="password" autocomplete="new-password" required minlength="8">
     <button class="btn" type="submit" id="cbtn">Guardar</button>
     ${obligatorio?'':'<div class="gnote"><a href="#" id="ccancel" style="color:var(--text-accent)">Volver al tablero</a></div>'}
   </form>`);
  setTimeout(()=>$('c0').focus(),40);

  return new Promise(resolve=>{
    if(!obligatorio) $('ccancel').addEventListener('click',e=>{e.preventDefault();cerrarGate();resolve(ses);});
    $('cform').addEventListener('submit',async e=>{
      e.preventDefault();
      if($('c1').value!==$('c2').value){
        $('cerr').innerHTML='<div class="gerr">Las dos contraseñas nuevas no coinciden.</div>';
        $('c2').value=''; $('c2').focus(); return;
      }
      const btn=$('cbtn'); btn.disabled=true; btn.textContent='Guardando…';
      let r;
      try{ r=await api('password',{token:ses.token,actual:$('c0').value,nueva:$('c1').value}); }
      catch(err){ r={ok:false,error:'No pudimos conectarnos. Probá de nuevo.'}; }
      if(!r||!r.ok){
        $('cerr').innerHTML=`<div class="gerr">${(r&&r.error)||'No se pudo cambiar la contraseña.'}</div>`;
        btn.disabled=false; btn.textContent='Guardar'; return;
      }
      const nueva=Object.assign({},ses,{token:r.token,cambiar:false});
      sesionGuardar(nueva); cerrarGate(); resolve(nueva);
    });
  });
}

/* ===== arranque de la sesión y de los datos =====
   Va antes que todo lo demás porque el dataset depende de quién entró. El bucle cubre el caso
   de la sesión vencida: el servidor responde code:'sesion', se borra y se vuelve a pedir login. */
let RESP=null, FATAL='', BACKGROUND_REFRESH=null, USED_CACHE=false;
try{
  USER=sesionLeer();
  for(let intento=0; intento<4; intento++){
    if(!USER) USER=await pedirLogin();
    if(USER.cambiar) USER=await pedirCambioClave(USER,true);
    pintarSesion();
    const cached=dataCacheLeer(USER);
    if(cached){
      loadingState('Validando la sesión…','La última sincronización guardada está lista para abrir.');
      syncState('Validando sesión…','loading');
      let validation=null;
      try{ validation=await api('objetivos',{token:USER.token},15000); }catch(err){}
      if(validation&&validation.code==='sesion'){
        dataCacheBorrar(USER); sesionBorrar(); USER=null; continue;
      }
      if(validation&&validation.ok){
        RESP=cached.response;
        RESP.objetivo=esDireccion()
          ? {mes:validation.mes,empresa:validation.objetivos.empresa,vendedoras:validation.objetivos.vendedoras}
          : {mes:validation.mes,mio:validation.mio};
        USED_CACHE=true;
        BACKGROUND_REFRESH=api('data',{token:USER.token},45000);
        break;
      }
    }
    loadingState('Trayendo la última sincronización…','La primera carga puede tardar unos segundos; después se abre desde memoria local.');
    syncState('Conectando con Odoo…','loading');
    RESP=await api('data',{token:USER.token},45000);
    if(RESP&&RESP.ok) break;
    if(RESP&&RESP.code==='sin_vendedora'){ FATAL='sin_vendedora'; break; }
    if(RESP&&RESP.code==='sesion'){ sesionBorrar(); USER=null; continue; }
    FATAL=(RESP&&RESP.error)||'No pudimos cargar los datos.'; break;
  }
}catch(err){
  syncState('Odoo no disponible','error');
  FATAL=err&&err.name==='AbortError'
    ? 'La carga superó los 45 segundos y se canceló. Recargá la página; si sigue, avisale a Calcuta.'
    : 'No pudimos conectarnos con el servidor. Recargá la página; si sigue, avisale a Calcuta.';
}
if(RESP&&RESP.ok&&!USED_CACHE) dataCacheGuardar(USER,RESP);
if(RESP&&RESP.objetivo) OBJETIVO=Object.assign(OBJETIVO,RESP.objetivo);

/* Normalizar ANTES de cualquier const que lea RAW. Varias (MULTIYEAR, HASDAY, DAY0…) recorren
   RAW.O apenas se evalúan, o sea muchísimo antes de que arrancar() pueda mostrar un cartel de
   error: con un dataset vacío —vendedora cuyo nombre no matchea Odoo, backend sin sincronizar,
   o caída de red— reventaban en top-level y la página quedaba en blanco sin decir nada. */
const RAW=(RESP&&RESP.raw)||{};
RAW.O = RAW.O || [];
RAW.L = RAW.L || [];
RAW.P = RAW.P || [];
RAW.C = RAW.C || [];
RAW.dict = RAW.dict || {VEN:[],CAN:[],TIPO:[],PROV:[],IND:[],CAT:[],MON:[],STAGE:[]};
RAW.meta = RAW.meta || {};
RAW.rateMon = RAW.rateMon || {};
RAW.usdFuente = RAW.usdFuente || '';
RAW.usdFecha = RAW.usdFecha || '';
RAW.rateDay = RAW.rateDay || [];

/* Compatibilidad inmediata con datasets ya cacheados: Yeni es la cuenta técnica de Tiendanube,
   no una vendedora. Compactar el diccionario y remapear las filas evita que figure duplicada
   incluso antes de que termine la siguiente sincronización de Apps Script. */
(function agruparTiendanube(raw){
  const old=(raw.dict&&raw.dict.VEN)||[];
  if(!old.some(v=>/^yeni$/i.test(String(v).trim()))) return;
  const labels=old.map(v=>/^yeni$/i.test(String(v).trim())?'Web (Tiendanube)':v), compact=[];
  labels.forEach(v=>{if(compact.indexOf(v)<0) compact.push(v);});
  const remap=labels.map(v=>compact.indexOf(v));
  [raw.O,raw.L,raw.P,raw.C].forEach(rows=>(rows||[]).forEach(row=>{if(remap[row[1]]!==undefined)row[1]=remap[row[1]];}));
  raw.dict.VEN=compact;
})(RAW);

/* ===== fechas =====
   Cada fila trae su día como offset entero desde meta.day0. Trabajamos siempre en UTC para que
   el filtro no se corra un día según el huso del navegador, y "hoy" sale de meta.today (TZ del
   negocio, no del dispositivo) para que "mes actual"/"YTD" coincidan con los datos. */
const DAY_MS=86400000;
const isoToDayN=iso=>{const p=String(iso).slice(0,10).split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/DAY_MS;};
const DAY0=isoToDayN(RAW.meta.day0||'2000-01-01');
const offToDate=off=>new Date((DAY0+off)*DAY_MS);
const offToIso=off=>offToDate(off).toISOString().slice(0,10);
const isoToOff=iso=>isoToDayN(iso)-DAY0;
const TODAY=isoToOff(RAW.meta.today||RAW.meta.maxDate||RAW.meta.day0||'2000-01-01');
const MAXOFF=isoToOff(RAW.meta.maxDate||RAW.meta.today||RAW.meta.day0||'2000-01-01');
const MINOFF=Math.max(0,isoToOff(RAW.meta.dateFrom||'2026-03-01'));
const fmtDay=off=>{const t=offToDate(off);return t.getUTCDate()+' '+MESL[t.getUTCMonth()]+' '+t.getUTCFullYear();};
const fmtFecha=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?(m[3]+'/'+m[2]+'/'+m[1]):(s||'');};

/* Presets de período → [desde,hasta] en offsets inclusive (null = sin tope) */
const PRESETS=[['mtd','Mes actual'],['lastmon','Mes anterior'],['d30','Últimos 30 días'],
               ['d90','Últimos 90 días'],['qtd','Trimestre en curso'],['ytd','Año en curso (YTD)']];
function rangeOf(key){
  const t=offToDate(TODAY), Y=t.getUTCFullYear(), M=t.getUTCMonth();
  const mk=(y,m,d)=>Date.UTC(y,m,d)/DAY_MS-DAY0;   // Date.UTC(y,m,0) = último día del mes anterior
  if(key==='mtd') return [mk(Y,M,1),TODAY];
  if(key==='lastmon') return [mk(Y,M-1,1),mk(Y,M,0)];
  if(key==='d30') return [TODAY-29,TODAY];
  if(key==='d90') return [TODAY-89,TODAY];
  if(key==='qtd') return [mk(Y,Math.floor(M/3)*3,1),TODAY];
  if(key==='ytd') return [mk(Y,0,1),TODAY];
  return [MINOFF,null];   // 'all' y cualquier clave desconocida
}
let F={per:'all',from:MINOFF,to:null,ven:'',can:''};
function setPeriod(key){F.per=key;const r=rangeOf(key);F.from=r[0]===null?MINOFF:Math.max(MINOFF,r[0]);F.to=r[1];}
function rangeLabel(){
  if(F.per==='all') return 'Todo el período · '+fmtDay(MINOFF)+' a '+fmtDay(MAXOFF);
  if(F.from===null&&F.to===null) return 'Todo el período · '+fmtDay(0)+' a '+fmtDay(MAXOFF);
  if(F.from===null) return 'Hasta '+fmtDay(F.to);
  if(F.to===null) return 'Desde '+fmtDay(F.from);
  if(F.from===F.to) return fmtDay(F.from);
  return fmtDay(F.from)+' a '+fmtDay(F.to);
}

/* ===== formato (money()/moneyFull() SÓLO formatean — la conversión USD por-mes pasa en compute()) ===== */
const rate=RAW.rate||0;
function money(v){
  const sym=CUR==='USD'?'US$':'$';
  const a=Math.abs(v);
  if(a>=1e6) return sym+' '+(v/1e6).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';
  if(a>=1e3) return sym+' '+(v/1e3).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+' K';
  return sym+' '+Math.round(v).toLocaleString('es-AR');
}
function moneyFull(v){return (CUR==='USD'?'US$':'$')+' '+Math.round(v).toLocaleString('es-AR');}
const n0=v=>Math.round(v||0).toLocaleString('es-AR');
/* MULTIYEAR: desde los meses realmente presentes en O (ventas) — no dict.MON, que también junta meses del CRM */
const MULTIYEAR=(function(){var y={};RAW.O.forEach(o=>{var m=RAW.dict.MON[o[0]];if(/^\d{4}/.test(m))y[m.slice(0,4)]=1;});return Object.keys(y).length>1;})();
const monLabel=m=>/^\d{4}-\d{2}$/.test(m)?MES[+m.slice(5,7)-1]+(MULTIYEAR?" '"+m.slice(2,4):''):m;
const monFull=m=>/^\d{4}-\d{2}$/.test(m)?MES[+m.slice(5,7)-1]+' '+m.slice(0,4):m;
const canLabel=n=>n;
const shortProv=n=>({'Ciudad Autónoma de Buenos Aires':'CABA','Ciudad Autonoma de Buenos Aires':'CABA'})[n]||n;
const titch=s=>s.toLowerCase().replace(/(^|\s|\/)\S/g,m=>m.toUpperCase());

/* ===== segmentos de producto — mapeo sobre el ROOT de categ_id (dict.CAT) ===== */
const NO_PRENDA=['ALL','GASTOS','INSUMOS','TELA','TELAS','PRODUCTOS A BORRAR']; // no son prenda -> "Sin categorizar"
function normRoot(s){return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function bucketOf(rootRaw){
  const r=normRoot(rootRaw);
  if(NO_PRENDA.indexOf(r)>=0) return 'Sin categorizar';
  if(r==='SANIDAD') return 'Sanidad';
  if(r==='LABORAL') return 'Laboral';
  if(/SASTRERIA|CAMISERIA|CHOMBA|REMERA|TAPADO|CAMPERA|SACO|PANTALON|CAMISA/.test(r)) return 'Administración';
  if(/ACCESORIOS|BORDADO/.test(r)) return 'Otros / Accesorios';
  return 'Otros / Accesorios';
}
function median(arr){
  if(!arr.length) return 0;
  const n=arr.length, mid=Math.floor(n/2);
  return n%2 ? arr[mid] : Math.round((arr[mid-1]+arr[mid])/2);
}

/* ===== filtros + agregación =====
   El día está en O[7], L[8], P[5] y C[4] (offset desde meta.day0). Líneas y remitos se filtran por
   la fecha de SU orden, no por la propia: así la plata y las unidades del período siempre cierran. */
/* HASDAY: el dataset viejo (previo a que el backend emita el día por fila) no tiene O[7] ni meta.day0.
   Entre el deploy y la primera re-sincronización se sirve ese dataset: sin este guard, inR(undefined)
   daría false para todo y el tablero quedaría vacío. Sin días, el filtro de fechas queda inerte. */
const HASDAY=!!(RAW.meta.day0 && RAW.O.length && RAW.O[0].length>7);

/* ===== período de comparación =====
   Ariel: "los datos aislados no me sirven tanto si no puedo ver el comparativo". Todo delta del
   tablero se mide contra ESTE rango. El criterio cambia según el preset, porque comparar un
   "mes actual" incompleto contra la ventana de igual largo que lo precede daría un tramo a caballo
   entre dos meses y el número no querría decir nada:
     mes actual   → mismo tramo de días del mes anterior (1-24 ago vs 1-24 jul)
     mes anterior → el mes completo previo a ése
     YTD          → mismo tramo del año pasado
     resto        → la ventana inmediatamente anterior, del mismo largo
   "Todo el período" no compara contra nada: no hay un antes. */
function prevRange(){
  if(!HASDAY||F.from===null||F.to===null) return null;
  const A=offToDate(F.from), B=offToDate(F.to);
  const mk=(y,m,d)=>Date.UTC(y,m,d)/DAY_MS-DAY0;   // Date.UTC(y,m,0) = último día del mes m-1
  if(F.per==='mtd'||F.per==='lastmon'){
    const y=A.getUTCFullYear(), m=A.getUTCMonth();
    const finMes=mk(y,m,0);
    return [mk(y,m-1,1), F.per==='lastmon'?finMes:Math.min(mk(y,m-1,B.getUTCDate()),finMes)];
  }
  if(F.per==='ytd'){
    const y=A.getUTCFullYear();
    return [mk(y-1,0,1), mk(y-1,B.getUTCMonth(),B.getUTCDate())];
  }
  const largo=F.to-F.from+1;
  return [F.from-largo, F.from-1];
}
function prevLabel(){
  if(F.per==='mtd')     return 'mismo tramo del mes anterior';
  if(F.per==='lastmon') return 'el mes previo';
  if(F.per==='ytd')     return 'mismo tramo del año pasado';
  const r=prevRange();
  return r?fmtDay(r[0])+' a '+fmtDay(r[1]):'';
}

/* rng = [desde,hasta] en offsets; si no viene, se usa el filtro activo. Los filtros de vendedora y
   canal NO se parametrizan: el comparativo tiene que mirar el mismo recorte, sólo otra fecha. */
function contextoCRM(){
  const esWeb=nombre=>/^(web\s*\(tiendanube\)|yeni)$/i.test(String(nombre||'').trim());
  const web=(F.ven!==''&&esWeb(RAW.dict.VEN[Number(F.ven)]))
    ||(F.can!==''&&esWeb(RAW.dict.CAN[Number(F.can)]));
  // Las filas CRM actuales no traen canal. No presentar el total como si estuviera filtrado.
  const visible=!web&&F.can==='';
  return {web,visible,principal:visible&&F.ven!==''};
}
function porcentajeCierres(cantidad,total){
  return total?Math.round(100*cantidad/total)+'%':'Sin cierres';
}
function notaCalidadCRM(estado){
  const notas=[];
  if(estado.sinFechaCierre) notas.push(n0(estado.sinFechaCierre)+' oportunidades sin fecha de cierre incluidas por fecha de alta; el porcentaje usa esa referencia');
  if(estado.sinEstado) notas.push(n0(estado.sinEstado)+' registros sin estado identificable excluidos (por fecha de alta)');
  return notas.join('. ');
}
function agruparEtapasCRM(etapas){
  const grupos=[];
  etapas.forEach(etapa=>{
    const nombre=normRoot(etapa.n);
    const grupo=['NUEVA CONSULTA','CONTACTADO'].includes(nombre)?'Contacto inicial'
      :['COTIZACION ENVIADA','NEGOCIACION'].includes(nombre)?'En gestión'
      :nombre==='NO AVANZARA'?'No avanzará':etapa.n;
    let item=grupos.find(g=>g.n===grupo);
    if(!item){item={n:grupo,v:0,etapas:[]};grupos.push(item);}
    item.v+=etapa.v;
    item.etapas.push(etapa);
  });
  return grupos;
}
function compute(rng){
  const d=RAW.dict;
  const RA=rng?rng[0]:F.from, RB=rng?rng[1]:F.to;
  const inR=day=>!HASDAY||((RA===null||day>=RA)&&(RB===null||day<=RB));
  const passO=o=>inR(o[7])&&(F.ven===''||o[1]==F.ven)&&(F.can===''||o[2]==F.can);
  const passL=l=>inR(l[8])&&(F.ven===''||l[1]==F.ven)&&(F.can===''||l[2]==F.can);
  const passP=p=>inR(p[5])&&(F.ven===''||p[1]==F.ven)&&(F.can===''||p[2]==F.can);
  /* CRM usa más de una fecha: recibida=create_date, ganada/perdida=date_closed y convertida=
     date_conversion. Recortarlo todo por create_date hacía desaparecer cierres del mes de leads
     nacidos antes y permitía que un cierre futuro reescribiera el histórico. */
  const passC=c=>(F.ven===''||c[1]==F.ven);
  const O=RAW.O.filter(passO), L=RAW.L.filter(passL), P=RAW.P.filter(passP), C=RAW.C.filter(passC);

  /* conversión USD acá y sólo acá — money()/moneyFull() sólo formatean.
     Cada venta va al oficial de SU DÍA (rateDay): con el promedio mensual, un rango sub-mensual
     (ej. 1-10 de marzo) se valuaría al promedio de todo marzo. Si el día no tiene dato se cae al
     promedio del mes, y si tampoco hay se cuenta como no convertible ("en construcción"). */
  const monRate=mi=>RAW.rateMon[d.MON[mi]]||0;
  const missMonths={};
  let convOk=0, convFail=0;
  function toCur(mi,day,ars){
    if(CUR!=='USD') return ars;
    const r=RAW.rateDay[day]||monRate(mi);
    if(!r){ missMonths[d.MON[mi]]=1; convFail++; return 0; }
    convOk++;
    return ars/r;
  }

  const mm={}; O.forEach(o=>{(mm[o[0]]=mm[o[0]]||{v:0,n:0}); mm[o[0]].v+=toCur(o[0],o[7],o[6]); mm[o[0]].n++;});
  const mk=Object.keys(mm).map(Number).sort((a,b)=>d.MON[a]<d.MON[b]?-1:1);
  const meses=mk.map(k=>({m:monLabel(d.MON[k]),ventas:mm[k].v,nv:mm[k].n,noRate:CUR==='USD'&&mm[k].n>0&&mm[k].v===0}));
  let ventas=0; O.forEach(o=>ventas+=toCur(o[0],o[7],o[6])); const nord=O.length;
  /* Prendas y órdenes POR TIPO, indexadas igual que d.TIPO. Antes eran dos contadores fijos
     (Pronta Entrega vs "todo lo demás") y por eso las 739 órdenes de Ecommerce se sumaban a
     Tradicional. Ahora la cantidad de tipos la manda el dataset, así que si el backend agrega
     otro no hay que tocar nada acá. */
  const nTipos=(d.TIPO||[]).length||2;
  const prT=new Array(nTipos).fill(0), oT=new Array(nTipos).fill(0);
  let ent=0;
  L.forEach(l=>{ if(l[3]<nTipos) prT[l[3]]+=l[5]; ent+=l[6]; });
  O.forEach(o=>{ if(o[3]<nTipos) oT[o[3]]++; });
  const prTot=prT.reduce((a,b)=>a+b,0);
  const vm={}; O.forEach(o=>{(vm[o[1]]=vm[o[1]]||{m:0,n:0}); vm[o[1]].m+=toCur(o[0],o[7],o[6]); vm[o[1]].n++;});
  const vend=Object.keys(vm).map(i=>({n:d.VEN[i],monto:vm[i].m,ops:vm[i].n})).sort((a,b)=>b.monto-a.monto).slice(0,10);
  const webI=d.CAN.indexOf('Web (Tiendanube)'), presI=d.CAN.indexOf('Venta directa');
  const cm={}; O.forEach(o=>{(cm[o[2]]=cm[o[2]]||{m:0,n:0}); cm[o[2]].m+=toCur(o[0],o[7],o[6]); cm[o[2]].n++;});
  const web=cm[webI]||{m:0,n:0}, pres=cm[presI]||{m:0,n:0};
  const gm={}; O.forEach(o=>{gm[o[4]]=(gm[o[4]]||0)+toCur(o[0],o[7],o[6]);});
  const provincia=Object.keys(gm).map(i=>({n:shortProv(d.PROV[i]),v:gm[i],muted:d.PROV[i].indexOf('(sin ')===0})).sort((a,b)=>b.v-a.v).slice(0,12);
  const im={}; O.forEach(o=>{im[o[5]]=(im[o[5]]||0)+toCur(o[0],o[7],o[6]);});
  const iArr=Object.keys(im).map(i=>({n:d.IND[i],v:im[i],muted:d.IND[i].indexOf('(sin ')===0}));
  const industria=iArr.filter(x=>!x.muted).sort((a,b)=>b.v-a.v).slice(0,6).concat(iArr.filter(x=>x.muted));

  /* categorías (root dict.CAT) en moneda activa */
  const km={}; L.forEach(l=>{km[l[4]]=(km[l[4]]||0)+toCur(l[0],l[8],l[7]);});

  /* "categorías reales de Odoo" — filtra roots que no son prenda (Gastos/All/Insumos/Tela/Productos a Borrar) */
  const catFiltered=Object.keys(km).filter(i=>NO_PRENDA.indexOf(normRoot(d.CAT[i]))<0);
  let totCatReal=0; catFiltered.forEach(i=>totCatReal+=km[i]); totCatReal=totCatReal||1;
  const cat=catFiltered.map(i=>({n:titch(d.CAT[i]),v:km[i],p:Math.round(100*km[i]/totCatReal)})).sort((a,b)=>b.v-a.v).slice(0,8);

  /* segmentos de producto (mapeo) + "Sin categorizar" aparte */
  const bk={'Administración':0,'Laboral':0,'Sanidad':0,'Otros / Accesorios':0};
  let sinCat=0;
  Object.keys(km).forEach(i=>{const b=bucketOf(d.CAT[i]); if(b==='Sin categorizar') sinCat+=km[i]; else bk[b]+=km[i];});
  let totPrenda=0; Object.keys(bk).forEach(k=>totPrenda+=bk[k]); totPrenda=totPrenda||1;
  const grand=(totPrenda+sinCat)||1;
  const pal={'Administración':'#1e3a6e','Laboral':'#4a6da8','Sanidad':'#7fa3d9','Otros / Accesorios':'#a9b6c9'};
  const buckets=Object.keys(bk).map(nm=>({n:nm,v:bk[nm],p:Math.round(100*bk[nm]/totPrenda),c:pal[nm]})).sort((a,b)=>b.v-a.v);
  const sinCategorizar={n:'Sin categorizar',v:sinCat,p:Math.round(100*sinCat/grand)};

  const st={1:0,2:0,3:0}, difs=[]; P.forEach(p=>{st[p[3]]=(st[p[3]]||0)+1; if(p[3]===1&&p[4]>=0)difs.push(p[4]);});
  difs.sort((a,b)=>a-b);
  const ciclo={n:difs.length,dias:difs.length?Math.round(difs.reduce((a,b)=>a+b,0)/difs.length):0,mediana:median(difs)};
  const backlog=[{e:'Entregadas (pickings hechos)',n:st[1]||0,tone:'success'},{e:'En preparación (listas / asignadas)',n:st[2]||0,tone:'accent'},{e:'En espera de stock / producción',n:st[3]||0,tone:'warning'}];
  /* ===== CRM: ESTADO y ETAPA son cosas distintas (rearmado 04/09/2026) =====
     El embudo contaba la etapa donde quedó cada oportunidad como si fuera su estado. Cuando el
     equipo pierde una, la archiva en la etapa donde estaba y no la mueve a "NO AVANZARA": por eso
     el gráfico mostraba 48 perdidas cuando en Odoo hay 359, y dejaba 270 muertas contadas dentro
     de "Qualified". Ahora el estado sale de c[5] (0 abierta · 1 ganada · 2 perdida) y la etapa se
     muestra SÓLO sobre las abiertas, que es donde dice algo.
     GUARD: entre el push del backend y el re-sync del trigger pasan hasta 30 min sirviendo el
     dataset viejo, que no trae c[5]. Sin esto el embudo quedaría en cero para todos. */
  const tieneEstado=c=>[0,1,2].includes(c[5]);
  // Una fila antigua permite reconocer una ganada, pero no distinguir abierta de perdida.
  const estadoDe=c=>tieneEstado(c)?c[5]:(c[3]===1?1:null);
  const tieneCierre=c=>Number.isFinite(c[6])&&c[6]>=0;
  const sinEstado=C.filter(c=>estadoDe(c)===null&&inR(c[4])).length;
  let sinFechaCierre=0;
  const received=C.filter(c=>inR(c[4]));
  const converted=C.filter(c=>c.length>8&&Number.isFinite(c[7])&&c[7]>=0&&inR(c[7]));
  const fu={}, cv={}, lostReasons={}; let won=0, crmAb=0, crmPer=0;
  const wonIdsAll={};
  C.forEach(c=>{ if(estadoDe(c)===1&&c.length>8) wonIdsAll[c[8]]=1; });
  received.forEach(c=>{
    if(estadoDe(c)!==0) return;
    crmAb++;
    const s=d.STAGE[c[2]]; fu[s]=(fu[s]||0)+1;
  });
  C.forEach(c=>{
    const e=estadoDe(c); if(e===0||e===null) return;
    // Conserva el criterio previo: alta como referencia explícita si falta el cierre.
    // No modifica la fecha original ni oculta el resto de resultados válidos.
    const fechaCierre=tieneCierre(c), closeDay=fechaCierre?c[6]:c[4];
    if(!inR(closeDay)) return;
    if(!fechaCierre) sinFechaCierre++;
    const u=d.VEN[c[1]];
    if(e===1) won++; else { crmPer++; if(c[10]) lostReasons[c[10]]=(lostReasons[c[10]]||0)+1; }
    (cv[u]=cv[u]||{w:0,t:0,sinFecha:0}); cv[u].t++; if(e===1) cv[u].w++;
    if(!fechaCierre) cv[u].sinFecha++;
  });
  const crmEstado={recibidas:received.length,convertidas:converted.length,abiertas:crmAb,ganadas:won,
    perdidas:crmPer,cerradas:won+crmPer,sinFechaCierre,sinEstado};
  const ord=(RAW.meta.stageOrder||[]);
  /* La API de Odoo puede devolver los nombres base en inglés aunque la interfaz del cliente esté
     en español. Se muestran los mismos rótulos que usa el CRM de Zaphira. */
  const stageLabel=s=>({New:'Nuevo',Qualified:'Calificado',Proposition:'Propuesta',Won:'Ganado'}[s]||s);
  // Flujo de Odoo: oportunidades activas por etapa ACTUAL, filtradas por fecha de alta.
  // C[11] es independiente de "ganada": una ganada también puede estar archivada.
  const flujoTipos=received.filter(c=>c[9]===undefined||c[9]==='opportunity');
  const flujoFilas=flujoTipos.filter(c=>c[11]===0?false:c[11]===1?true:estadoDe(c)!==2);
  const flujoConteos={};
  flujoFilas.forEach(c=>{const s=d.STAGE[c[2]]||'(sin etapa)';flujoConteos[s]=(flujoConteos[s]||0)+1;});
  const flujoNombres=[...new Set([...ord,...(d.STAGE||[]),...Object.keys(flujoConteos)])];
  const flujoCRM={total:flujoFilas.length,archivadas:flujoTipos.length-flujoFilas.length,
    compatibilidad:flujoTipos.some(c=>c[11]!==0&&c[11]!==1||c[9]===undefined),
    etapas:flujoNombres.map(s=>({n:stageLabel(s),v:flujoConteos[s]||0}))};
  const funnel=Object.keys(fu).sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);})
    .map(s=>({n:stageLabel(s),v:fu[s],win:/won|ganad/i.test(s),lost:/NO AVANZAR|PERDID/i.test(s)}));
  const convvend=Object.keys(cv).filter(u=>cv[u].t>=5&&u!=='Sin asignar').map(u=>({n:u,w:cv[u].w,t:cv[u].t,sinFecha:cv[u].sinFecha})).sort((a,b)=>(b.w/b.t)-(a.w/a.t)).slice(0,6);
  const linked=O.filter(o=>o.length>9&&o[9]>0);
  const crmReconciliation={ordenes:O.length,vinculadas:linked.length,
    vinculadasGanadas:linked.filter(o=>wonIdsAll[o[9]]).length,sinOportunidad:O.length-linked.length};
  const motivosPerdida=Object.keys(lostReasons).map(n=>({n,v:lostReasons[n]})).sort((a,b)=>b.v-a.v);

  /* Year to Year — sólo si hay 2+ años realmente presentes en O */
  let yoy=null;
  if(MULTIYEAR){
    const ym={};
    O.forEach(o=>{const y=d.MON[o[0]].slice(0,4); (ym[y]=ym[y]||{v:0,n:0}); ym[y].v+=toCur(o[0],o[7],o[6]); ym[y].n++;});
    yoy=Object.keys(ym).sort().map(y=>({y,v:ym[y].v,n:ym[y].n}));
  }

  /* ===== evolución mes a mes por dimensión =====
     Ariel: "las ventas, lo de los canales, las prendas por tipo de orden, todo eso me gustaría
     verlo como en su evolución". Cada serie queda alineada al MISMO eje de meses (mk), así todas
     las tablas del tablero se leen contra las mismas columnas. */
  const mesLbl=mk.map(k=>monLabel(d.MON[k]));
  const posMes={}; mk.forEach((k,i)=>{posMes[k]=i;});
  function serieMes(rows,keyFn,valFn){
    const acc={};
    rows.forEach(r=>{
      const k=keyFn(r); if(k==null) return;
      const j=posMes[r[0]]; if(j===undefined) return;   // mes fuera del eje (no debería pasar)
      (acc[k]=acc[k]||new Array(mk.length).fill(0))[j]+=valFn(r);
    });
    return acc;
  }
  /* {nombre:[v,v,…]} → [{n,v:[…],c}] en el orden pedido, descartando series enteramente en cero */
  function aFilas(acc,orden,colores){
    return (orden||Object.keys(acc)).filter(k=>acc[k]&&acc[k].some(v=>v))
      .map(k=>({n:k,v:acc[k],c:(colores||{})[k]||''}));
  }

  /* TICKET PROMEDIO por pedido nuevo vs reposición (pedido de Ariel: sólo acá, no en todo el
     tablero). El backend marca cada orden en O[8] según la antigüedad del cliente: nuevo si su
     ficha se creó en el mismo mes de la venta. Son PROMEDIOS, no sumas, así que se acumula monto
     y cantidad por separado y se divide al final — sumar los promedios mensuales daría otra cosa.
     Guard HASREP: el dataset previo al 04/09/2026 no trae O[8] y la tarjeta no se muestra. */
  const palPedido={'Pedido nuevo':'#1e3a6e','Reposición':'#7fa3d9'};
  const HASREP=O.length===0||O[0].length>8;
  const tkAcc={'Pedido nuevo':new Array(mk.length).fill(0),'Reposición':new Array(mk.length).fill(0)};
  const tkCnt={'Pedido nuevo':new Array(mk.length).fill(0),'Reposición':new Array(mk.length).fill(0)};
  const tkTot={'Pedido nuevo':{m:0,n:0},'Reposición':{m:0,n:0}};
  if(HASREP) O.forEach(o=>{
    const j=posMes[o[0]]; if(j===undefined) return;
    const k=o[8]===1?'Pedido nuevo':'Reposición', v=toCur(o[0],o[7],o[6]);
    tkAcc[k][j]+=v; tkCnt[k][j]++; tkTot[k].m+=v; tkTot[k].n++;
  });
  const tkProm={};
  Object.keys(tkAcc).forEach(k=>{ tkProm[k]=tkAcc[k].map((v,i)=>tkCnt[k][i]?v/tkCnt[k][i]:0); });
  const ticketPedido=HASREP?{
    series:aFilas(tkProm,['Pedido nuevo','Reposición'],palPedido),
    nuevo:{n:tkTot['Pedido nuevo'].n,tk:tkTot['Pedido nuevo'].n?tkTot['Pedido nuevo'].m/tkTot['Pedido nuevo'].n:0},
    repo :{n:tkTot['Reposición'].n, tk:tkTot['Reposición'].n ?tkTot['Reposición'].m /tkTot['Reposición'].n :0}
  }:null;

  const palCanal={'Venta directa':'#1e3a6e','Web (Tiendanube)':'#7fa3d9'};
  const palTipo ={'Tradicional':'#1e3a6e','Pronta Entrega':'#7fa3d9','Ecommerce':'#4a6da8'};
  const topProv=provincia.filter(x=>!x.muted).slice(0,6).map(x=>x.n);
  const topVend=vend.slice(0,8).map(x=>x.n);

  const evo={
    lbl: mesLbl,
    canalMonto:  aFilas(serieMes(O,o=>d.CAN[o[2]],o=>toCur(o[0],o[7],o[6])), d.CAN, palCanal).map(x=>Object.assign({},x,{n:canLabel(x.n)})),
    canalOrd:    aFilas(serieMes(O,o=>d.CAN[o[2]],()=>1),                    d.CAN, palCanal).map(x=>Object.assign({},x,{n:canLabel(x.n)})),
    tipoPrendas: aFilas(serieMes(L,l=>d.TIPO[l[3]],l=>l[5]),                 d.TIPO, palTipo),
    tipoOrdenes: aFilas(serieMes(O,o=>d.TIPO[o[3]],()=>1),                   d.TIPO, palTipo),
    segmento:    aFilas(serieMes(L,l=>bucketOf(d.CAT[l[4]]),l=>toCur(l[0],l[8],l[7])),
                        ['Administración','Laboral','Sanidad','Otros / Accesorios','Sin categorizar'], pal),
    provincia:   aFilas(serieMes(O,o=>{const n=shortProv(d.PROV[o[4]]);return topProv.indexOf(n)>=0?n:null;},
                        o=>toCur(o[0],o[7],o[6])), topProv),
    vendedora:   aFilas(serieMes(O,o=>{const n=d.VEN[o[1]];return topVend.indexOf(n)>=0?n:null;},
                        o=>toCur(o[0],o[7],o[6])), topVend)
  };

  const usdMissingMonths=Object.keys(missMonths).sort();
  const usdBlocked=CUR==='USD' && convOk===0 && convFail>0;   // nada convertible en todo el filtro

  return {meses,ventas,nord,prT,oT,prTot,ent,vend,web,pres,provincia,industria,cat,buckets,sinCategorizar,ciclo,backlog,funnel,flujoCRM,convvend,crmN:received.length,won,yoy,evo,usdMissingMonths,usdBlocked,crmEstado,ticketPedido,crmReconciliation,motivosPerdida};
}

/* ===== barra horizontal (grid: label · pista · valor) ===== */
function hb(label,pct,val,opt){opt=opt||{};const w=opt.muted?Math.min(100,pct||0):(pct||0);return `<div class="hrow"><span class="hlbl" title="${label}"${opt.muted?' style="color:var(--text-muted)"':''}>${label}</span><div class="htrack"><div class="hbar" style="width:${Math.max(2,w).toFixed(1)}%;background:${opt.color||'var(--fill-primary)'}${opt.muted?';opacity:.5':''}"></div></div><span class="hval">${val}</span></div>`;}
function sec(A,n,t){A.appendChild(el(`<div class="sec"><span class="secn">${n}</span><span class="sect">${t}</span></div>`));}

/* ===== variación porcentual =====
   pct() devuelve null cuando no hay base contra la cual medir (base 0). Un "+100%" o un "+∞%"
   arrancando desde cero no informa nada y se lee como un crecimiento real: mejor un guion. */
function pct(a,b){ if(!b) return null; return (a-b)/Math.abs(b)*100; }
function dltTxt(p){ return (p>0?'+':'')+p.toFixed(Math.abs(p)<10?1:0)+'%'; }
function dltCls(p){ return p===null?'flat':(Math.abs(p)<0.5?'flat':(p>0?'up':'dn')); }
function dltBadge(a,b,titulo){
  const p=pct(a,b);
  const t=titulo?` title="${titulo}"`:'';
  if(p===null) return `<span class="dlt dlt--flat" title="Sin base de comparación en el período anterior">—</span>`;
  return `<span class="dlt dlt--${dltCls(p)}"${t}>${dltTxt(p)}</span>`;
}

/* ===== tabla de evolución mes a mes =====
   Una fila por serie, una columna por mes, y debajo de cada valor su variación contra el mes
   anterior de la misma fila. Reemplaza el "filtrar junio, anotar el número, filtrar julio,
   comparar a mano" que describió Ariel. La última fila totaliza salvo que haya una sola serie. */
function evoTable(lbl,filas,fmt,opt){
  opt=opt||{};
  if(!filas.length) return '<div class="pmsg">Sin datos para este filtro.</div>';
  const celda=(v,prev,i)=>{
    const p=i===0?null:pct(v,prev);
    return `<td><span class="cellv">${fmt(v)}</span><span class="celld ${dltCls(p)}">${p===null?'·':dltTxt(p)}</span></td>`;
  };
  const body=filas.map(f=>`<tr><td>${f.c?`<i class="sw" style="background:${f.c}"></i>`:''}${f.n}</td>`
    +f.v.map((v,i)=>celda(v,f.v[i-1],i)).join('')+'</tr>').join('');
  let tot='';
  if(opt.total!==false&&filas.length>1){
    const t=lbl.map((_,i)=>filas.reduce((s,f)=>s+f.v[i],0));
    tot=`<tr class="tot"><td>Total</td>`+t.map((v,i)=>celda(v,t[i-1],i)).join('')+'</tr>';
  }
  return `<div class="evo"><table><thead><tr><th></th>${lbl.map(m=>`<th>${m}</th>`).join('')}</tr></thead>`
    +`<tbody>${body}${tot}</tbody></table></div>`
    +`<div class="cmpnote">Debajo de cada valor, la variación contra el mes anterior.</div>`;
}

/* ===== gráfico de columnas + línea opcional en eje secundario =====
   SVG (no divs) porque la línea necesita coordenadas reales. Las etiquetas de valor van con halo
   blanco (paint-order:stroke) para seguir legibles donde la línea les pasa por detrás. */
const SERIE2='#0f766e';
/* Techo "redondo" del eje. Pasos finos: con saltos de 1/2/5/10 un máximo de 506 M estiraba el eje
   hasta 1.000 M y las columnas quedaban aplastadas contra el piso. */
function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
  const steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  for(const s of steps) if(f<=s+1e-9) return s*e;
  return 10*e;
}
/* Catmull-Rom → Bézier cúbico. Los puntos de control se recortan al rango vertical de cada tramo
   para que la curva no "sobrepase" (una serie que sube y baja no debe inventar picos ni valores
   negativos entre dos meses). */
function smoothPath(p){
  if(p.length<2) return '';
  let d='M'+p[0][0].toFixed(1)+','+p[0][1].toFixed(1);
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i], b=p[i], c=p[i+1], e=p[i+2]||c;
    const lo=Math.min(b[1],c[1]), hi=Math.max(b[1],c[1]);
    const cl=y=>Math.max(lo,Math.min(hi,y));
    d+='C'+(b[0]+(c[0]-a[0])/6).toFixed(1)+','+cl(b[1]+(c[1]-a[1])/6).toFixed(1)
      +' '+(c[0]-(e[0]-b[0])/6).toFixed(1)+','+cl(c[1]-(e[1]-b[1])/6).toFixed(1)
      +' '+c[0].toFixed(1)+','+c[1].toFixed(1);
  }
  return d;
}
function chartSVG(pts,opt){
  opt=opt||{};
  const line=!!opt.line, fmt=opt.fmt||n0;
  /* W ≈ ancho real de la tarjeta: si el viewBox fuera más angosto, el SVG se escalaría hacia
     arriba y tanto la altura como las tipografías crecerían de más. */
  /* Con opt.delta se reserva una segunda línea abajo para la variación mes contra mes. */
  const W=1000,H=opt.h||230,pl=74,pr=line?64:24,tp=14,bt=opt.delta?44:28;
  const iw=W-pl-pr, ih=H-tp-bt;
  const maxV=niceMax(Math.max.apply(null,pts.map(p=>p.v).concat([0])));
  const maxN=niceMax(Math.max.apply(null,pts.map(p=>p.n||0).concat([0])));
  const band=iw/Math.max(pts.length,1), bw=Math.min(72,band*0.55);
  const cx=i=>pl+band*i+band/2;
  const yV=v=>tp+ih-(v/maxV)*ih, yN=n=>tp+ih-(n/maxN)*ih;
  let g='';
  for(let t=0;t<=4;t++){
    const y=tp+ih-ih*t/4;
    g+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${pl+iw}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`
      +`<text x="${pl-9}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--text-muted)">${fmt(maxV*t/4)}</text>`;
    if(line) g+=`<text x="${pl+iw+9}" y="${(y+4).toFixed(1)}" text-anchor="start" font-size="11.5" fill="${SERIE2}">${n0(maxN*t/4)}</text>`;
  }
  let bars='',lbl='';
  const lblY=[];   // baseline de cada etiqueta de importe, para que la de órdenes la esquive
  pts.forEach((p,i)=>{
    const h=p.noRate?3:Math.max(2,ih-(yV(p.v)-tp)), y=tp+ih-h, x=cx(i);
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${p.noRate?'#c3ccd6':(opt.barColor||'var(--fill-primary)')}" opacity=".9"><title>${p.lbl}: ${p.noRate?'sin cotización oficial':fmt(p.v)}${line?' · '+n0(p.n)+' órdenes':''}</title></rect>`;
    /* Con línea, el importe se mete DENTRO de la columna (blanco) para dejarle la franja de arriba
       al nº de órdenes. Sólo si entra: alto suficiente y el texto más angosto que la columna
       (~6,4px por carácter a 12px), si no se desborda por los costados. */
    const txt=p.noRate?'🚧':fmt(p.v);
    const inside=line&&!p.noRate&&h>30&&txt.length*6.4<=bw-8;
    lblY[i]=inside?y+17:y-7;
    lbl+=inside
      ? `<text x="${x.toFixed(1)}" y="${lblY[i].toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${txt}</text>`
      : `<text x="${x.toFixed(1)}" y="${lblY[i].toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text-secondary)" stroke="#fff" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${txt}</text>`;
    lbl+=`<text x="${x.toFixed(1)}" y="${((opt.delta?H-24:H-8)).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--text-muted)">${p.lbl}</text>`;
    /* Variación contra el mes anterior, debajo del nombre del mes. Se omite en el primer mes (no
       tiene con qué comparar) y en los meses sin cotización, donde el valor es 0 por falta de dato
       y no por falta de ventas: ahí un "-100%" sería directamente falso. */
    if(opt.delta&&i>0&&!p.noRate&&!pts[i-1].noRate){
      const pv=pct(p.v,pts[i-1].v);
      if(pv!==null){
        const col=Math.abs(pv)<0.5?'var(--text-muted)':(pv>0?'var(--text-success)':'var(--text-danger)');
        lbl+=`<text x="${x.toFixed(1)}" y="${(H-7).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${col}">${dltTxt(pv)}</text>`;
      }
    }
  });
  let ln='';
  if(line){
    const lp=pts.map((p,i)=>[cx(i),yN(p.n||0)]);
    if(lp.length>1) ln+=`<path d="${smoothPath(lp)}" fill="none" stroke="${SERIE2}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    lp.forEach((q,i)=>{
      ln+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.8" fill="${SERIE2}" stroke="#fff" stroke-width="1.8"><title>${pts[i].lbl}: ${n0(pts[i].n)} órdenes</title></circle>`;
      /* Arriba del punto por defecto; si ahí se superpondría con la etiqueta de importe, se pasa
         abajo. Halo blanco para leerse igual sobre una columna oscura. */
      let ly=q[1]-14;                                   // separación suficiente para que la propia
      if(Math.abs(ly-lblY[i])<16) ly=q[1]+20;           // línea no cruce el texto al venir en pendiente
      ly=Math.max(tp+10,Math.min(tp+ih-4,ly));
      ln+=`<text x="${q[0].toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${SERIE2}" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${n0(pts[i].n)}</text>`;
    });
  }
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.aria||'Gráfico por mes'}">${g}${bars}${ln}${lbl}</svg></div>`;
}
const legendHTML=items=>'<div class="legend">'+items.map(x=>
  `<span><i class="sw${x.line?' sw--line':''}" style="background:${x.c}"></i>${x.t}</span>`).join('')+'</div>';
function row2(A,h1,c1,h2,c2,flex1){A.appendChild(el(`<div class="duo"><div class="card" style="flex:${flex1||1};min-width:min(300px,100%)"><h3>${h1}</h3>${c1}</div><div class="card" style="flex:1;min-width:min(260px,100%)"><h3>${h2}</h3>${c2}</div></div>`));}

/* ===== render ===== */
function go(){
  const app=document.getElementById('app'); app.innerHTML='';
  if(VISTA==='config'){ renderConfig(app); return; }
  const pr=prevRange();                       // null en "Todo el período": no hay un antes
  render(app,compute(),pr?compute(pr):null);
}

/* ===== OBJETIVO DEL MES ===================================================================
   El objetivo se carga en pesos y con IVA, así que la barra se muestra SIEMPRE en pesos aunque
   el tablero esté en dólares: convertir el objetivo a USD lo haría moverse solo con el tipo de
   cambio, y un objetivo que cambia todos los días no es un objetivo. */
function ventasDelMes(venIdx){
  const d=RAW.dict||{}, mi=(d.MON||[]).indexOf(mesHoy());
  if(mi<0) return 0;
  let t=0;
  (RAW.O||[]).forEach(o=>{ if(o[0]===mi&&(venIdx==null||o[1]===venIdx)) t+=o[6]; });
  return t;
}
function barraCumpl(rot,vendido,objetivo){
  const p=objetivo?Math.round(100*vendido/objetivo):0;
  const color=p>=100?'#2f7d4f':p>=70?'#4a6da8':'#8a6a1f';
  const falta=Math.max(0,objetivo-vendido);
  return `<div class="objbar">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
      <span>${rot}</span><b>${p}% <span style="color:var(--text-muted);font-weight:400">de $ ${n0(objetivo)}</span></b></div>
    <div class="objtrack"><div class="objfill" style="width:${Math.min(100,p)}%;background:${color}"></div></div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Vendido $ ${n0(vendido)}${
      falta>0?' · faltan $ '+n0(falta):' · objetivo cumplido'}</div></div>`;
}
function barraObjetivo(){
  const mes=mesLegible(mesHoy());
  if(esVendedora()){
    if(!OBJETIVO.mio) return '';
    return `<div class="card" style="margin-bottom:12px"><h3>Tu objetivo de ${mes}</h3>${
      barraCumpl('Tus ventas del mes',ventasDelMes(0),OBJETIVO.mio)}</div>`;
  }
  if(!esDireccion()) return '';
  const porVen=Object.keys(OBJETIVO.vendedoras||{}).filter(k=>OBJETIVO.vendedoras[k]>0);
  if(!OBJETIVO.empresa&&!porVen.length) return '';
  const d=RAW.dict||{};
  /* Dirección filtrando una persona ve sólo su objetivo. Sin filtro conserva el consolidado. */
  if(F.ven!==''){
    const i=Number(F.ven), nom=(d.VEN||[])[i], objetivo=OBJETIVO.vendedoras[nom]||0;
    if(!objetivo) return '';
    return `<div class="card" style="margin-bottom:12px"><h3>Objetivo de ${nom} · ${mes}</h3>${
      barraCumpl(nom,ventasDelMes(i),objetivo)}<div style="font-size:11px;color:var(--text-muted);margin-top:8px">Monto en pesos con IVA.</div></div>`;
  }
  const detalle=porVen.map(nom=>{
    const i=(d.VEN||[]).indexOf(nom);
    return barraCumpl(nom,i<0?0:ventasDelMes(i),OBJETIVO.vendedoras[nom]);
  }).join('');
  return `<div class="card" style="margin-bottom:12px"><h3>Objetivo de ${mes}</h3>${
    OBJETIVO.empresa?barraCumpl('<b>Toda la empresa</b>',ventasDelMes(null),OBJETIVO.empresa):''}${
    detalle?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">${detalle}</div>`:''}
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Montos en pesos con IVA. Se cargan desde <b>Configuración</b>.</div></div>`;
}

/* ===== CONFIGURACIÓN (sólo Dirección) =====================================================
   Dos cosas en una pantalla: los accesos del equipo y los objetivos del mes. Están juntas
   porque se tocan en el mismo momento —cuando entra o sale alguien, y cuando arranca el mes—
   y separarlas obligaría a acordarse de dos lugares. */
let VISTA='tablero';
let CFG={usuarios:null,mes:'',objetivos:null,cargando:false};

const mesLegible=m=>{const p=String(m).split('-');return p.length===2?MES[+p[1]-1]+' '+p[0]:m;};
function mesHoy(){ return (RAW.meta&&RAW.meta.today?RAW.meta.today:new Date().toISOString()).slice(0,7); }
/* Meses ofrecidos para cargar objetivos: el actual y los tres siguientes. Cargar el objetivo de
   un mes ya cerrado no cambia nada, y ofrecerlo sólo invita a corregir el pasado. */
function mesesCargables(){
  const [y,m]=mesHoy().split('-').map(Number), out=[];
  for(let i=0;i<4;i++){ const d=new Date(Date.UTC(y,m-1+i,1)); out.push(d.toISOString().slice(0,7)); }
  return out;
}

async function cargarConfig(mes){
  CFG.cargando=true; go();
  const [u,o]=await Promise.all([api('usuarios',{token:USER.token}),api('objetivos',{token:USER.token,mes})]);
  if(u&&u.code==='sesion'){ sesionBorrar(); location.reload(); return; }
  CFG.usuarios=(u&&u.usuarios)||[];
  CFG.mes=(o&&o.mes)||mes;
  CFG.objetivos=(o&&o.objetivos)||{empresa:0,vendedoras:{}};
  CFG.cargando=false; go();
}

function renderConfig(A){
  A.appendChild(el(`<div class="periodbar" style="justify-content:space-between">
    <span>${ICO.cal}<span style="margin-left:6px"><b>Configuración</b> · accesos y objetivos</span></span>

  document.getElementById('cfgBack').addEventListener('click',()=>{VISTA='tablero';go();});

  if(CFG.cargando||!CFG.usuarios){
    A.appendChild(el('<div class="card"><h3>Cargando…</h3></div>'));
    return;
  }

  /* --- objetivos del mes --- */
  const vend=CFG.usuarios.filter(u=>u.rol==='vendedora'&&u.activo);
  const val=a=>a==='empresa'?(CFG.objetivos.empresa||0):(CFG.objetivos.vendedoras[a]||0);
  /* El monto en letras debajo del campo NO es decoración: son objetivos de nueve cifras y un cero
     de más o de menos no se ve a simple vista en un input numérico. Se actualiza al tipear. */
  const filaObj=(a,rot)=>{const id='ob_'+a.replace(/\W/g,'_');return `<div class="ofila">
      <label for="${id}">${rot}</label>
      <div><input class="ctl" type="number" min="0" step="100000" inputmode="numeric"

    </div>`;};
  A.appendChild(el(`<div class="card"><h3>Objetivo de ventas</h3>
    <div class="pmsg" style="margin-bottom:12px">Montos con IVA, en pesos. El de la empresa se muestra en el tablero de Dirección; el de cada vendedora, en su propio tablero. Dejar en blanco es no fijar objetivo: no aparece la barra.</div>
    <div class="ofila" style="margin-bottom:14px">
      <label for="cfgMes">Mes</label>
      <select class="ctl" id="cfgMes">${mesesCargables().map(m=>
        `<option value="${m}"${m===CFG.mes?' selected':''}>${mesLegible(m)}</option>`).join('')}</select>
    </div>
    <div id="objForm">${filaObj('empresa','<b>Toda la empresa</b>')}
      <div style="height:1px;background:var(--border);margin:12px 0"></div>
      ${vend.map(u=>filaObj(u.vendedora,u.nombre)).join('')}</div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
      <button class="btn" id="objSave" type="button">Guardar objetivos</button>
      <span id="objMsg" style="font-size:12px;color:var(--text-muted)"></span></div></div>`));

  document.getElementById('cfgMes').addEventListener('change',e=>cargarConfig(e.target.value));
  [...document.querySelectorAll('#objForm input')].forEach(i=>i.addEventListener('input',()=>{
    const v=Number(i.value)||0;
    document.getElementById(i.id+'_h').textContent=v?'$ '+n0(v):'sin objetivo';
  }));
  document.getElementById('objSave').addEventListener('click',async()=>{
    const b=document.getElementById('objSave'), msg=document.getElementById('objMsg');
    b.disabled=true; msg.textContent='Guardando…';
    const filas=[...document.querySelectorAll('#objForm input')].map(i=>
      ({alcance:i.dataset.alcance,objetivo:Number(i.value)||0}));
    let r;
    try{ r=await api('guardarObjetivos',{token:USER.token,mes:CFG.mes,filas}); }
    catch(err){ r={ok:false,error:'No pudimos conectarnos con la planilla.'}; }
    b.disabled=false;
    msg.textContent=r&&r.ok?'Guardado y verificado.':('No se pudo guardar. '+((r&&r.error)||''));
    if(r&&r.ok){
      // Usamos lo que el servidor releyó de la hoja, no los valores todavía presentes en pantalla.
      CFG.objetivos=r.objetivos||{empresa:0,vendedoras:{}};
      // Si se cambió el objetivo del mes en curso, el tablero tiene que reflejarlo al volver.
      if(CFG.mes===mesHoy()){
        OBJETIVO.empresa=CFG.objetivos.empresa;
        OBJETIVO.vendedoras=CFG.objetivos.vendedoras;
      }
    }
  });

  /* --- accesos --- */
  const filaU=u=>`<tr>
      <td><b>${u.nombre}</b><div style="font-size:11px;color:var(--text-muted)">${u.usuario}${u.vendedora?' · '+u.vendedora:''}</div></td>
      <td>${u.rol==='direccion'?'Dirección':'Vendedora'}</td>
      <td>${u.ultimoIngreso||'<span style="color:var(--text-muted)">nunca entró</span>'}
          ${u.debeCambiar?'<div style="font-size:11px;color:var(--text-warning,#8a6a1f)">tiene la clave inicial</div>':''}</td>
      <td style="white-space:nowrap">
        <button class="btn btn--quiet" data-acc="reset" data-u="${u.usuario}" type="button">Resetear clave</button>
        <button class="btn btn--quiet" data-acc="${u.activo?'baja':'alta'}" data-u="${u.usuario}" type="button">${u.activo?'Desactivar':'Reactivar'}</button>
      </td></tr>`;
  const cardAcc=el(`<div class="card" style="margin-top:12px"><h3>Accesos</h3>
    <div class="pmsg" style="margin-bottom:12px">Resetear una clave la vuelve a la inicial y obliga a cambiarla en el próximo ingreso. Desactivar no borra nada: la persona deja de entrar pero queda el registro.</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Persona</th><th>Rol</th><th>Último ingreso</th><th></th></tr></thead>
      <tbody>${CFG.usuarios.filter(u=>u.activo).map(filaU).join('')}
      ${CFG.usuarios.some(u=>!u.activo)?`<tr><td colspan="4" style="padding-top:14px;color:var(--text-muted);font-size:12px">Desactivados</td></tr>`+CFG.usuarios.filter(u=>!u.activo).map(filaU).join(''):''}</tbody></table></div>
    <div id="accMsg" style="font-size:12px;color:var(--text-muted);margin-top:10px"></div></div>`);
  A.appendChild(cardAcc);
  cardAcc.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-acc]'); if(!b) return;
