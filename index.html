/* ===== OBJETIVO DEL MES ===================================================================
   Metas guardadas en ARS. Convertimos meta, vendido y saldo con la misma referencia;
   el cumplimiento no cambia al alternar moneda. */
function tasaObjetivo(mes=mesHoy()){
  const r=Number((RAW.rateMon||{})[mes])||Number(RAW.rate);
  return Number.isFinite(r)&&r>0?r:0;
}
function montoObjetivo(ars,mes=mesHoy()){
  if(CUR!=='USD') return moneyFull(ars);
  const r=tasaObjetivo(mes);
  return r?moneyFull(ars/r):'Sin cotización';
}
function notaObjetivo(mes){
  if(CUR==='USD'&&!tasaObjetivo(mes)) return 'Sin cotización disponible para mostrar objetivos en USD.';
  const moneda=CUR==='USD'?`Montos con IVA en USD · referencia: ARS ${n0(tasaObjetivo(mes))} por USD. Cumplimiento calculado en ARS.`:'Montos con IVA en ARS.';
  return moneda+' Ventas del período seleccionado contra el objetivo mensual completo.';
}
function ventasDelMes(venIdx,mes){
  const d=RAW.dict||{}, mi=(d.MON||[]).indexOf(mes);
  if(mi<0) return 0;
  let t=0;
  (RAW.O||[]).forEach(o=>{
    if(o[0]===mi&&(venIdx==null||o[1]===venIdx)&&(F.can===''||o[2]==F.can)
      &&(!HASDAY||((F.from===null||o[7]>=F.from)&&(F.to===null||o[7]<=F.to)))) t+=o[6];
  });
  return t;
}
function barraCumpl(rot,vendido,objetivo,mes){
  const p=objetivo?Math.round(100*vendido/objetivo):0;
  const color=p>=100?'#2f7d4f':p>=70?'#4a6da8':'#8a6a1f';
  const falta=Math.max(0,objetivo-vendido);
  return `<div class="objbar">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px">
      <span>${rot}</span><b>${p}% <span style="color:var(--text-muted);font-weight:400">de ${montoObjetivo(objetivo,mes)}</span></b></div>
    <div class="objtrack"><div class="objfill" style="width:${Math.min(100,p)}%;background:${color}"></div></div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Vendido ${montoObjetivo(vendido,mes)}${
      falta>0?' · faltan '+montoObjetivo(falta,mes):' · objetivo cumplido'}</div></div>`;
}
const OBJETIVOS_MES=new Map([[OBJETIVO.mes||(RAW.meta.today||BUSINESS_TODAY).slice(0,7),{datos:OBJETIVO}]]);
function mesesEntre(inicio,fin){
  const meses=[];
  if(inicio>fin) return meses;
  for(let i=inicio.getUTCFullYear()*12+inicio.getUTCMonth();i<=fin.getUTCFullYear()*12+fin.getUTCMonth();i++){
    meses.push(new Date(Date.UTC(Math.floor(i/12),i%12,1)).toISOString().slice(0,7));
  }
  return meses;
}
function mesesObjetivoPeriodo(){
  return mesesEntre(offToDate(F.from===null?MINOFF:F.from),offToDate(F.to===null?MAXOFF:F.to));
}
function estadoObjetivoMes(mes){
  if(!OBJETIVOS_MES.has(mes)){
    const estado={cargando:true}; OBJETIVOS_MES.set(mes,estado);
    api('objetivos',{token:USER.token,mes}).then(r=>{
      if(!r||!r.ok||r.mes!==mes) throw new Error('objetivos');
      estado.datos=esVendedora()?{mio:r.mio}:{empresa:0,tiendanube:0,vendedoras:{},...r.objetivos};
    }).catch(()=>{estado.error=true;}).finally(()=>{estado.cargando=false;if(VISTA==='tablero'||VISTA==='tienda')go();});
  }
  return OBJETIVOS_MES.get(mes);
}
function barraObjetivo(){
  return mesesObjetivoPeriodo().map(mes=>{
    const estado=estadoObjetivoMes(mes);
    if(estado.cargando||estado.error) return `<div class="card" style="margin-bottom:12px"><h3>Objetivo de ${mesLegible(mes)}</h3><div class="pmsg">${estado.error?'No pudimos cargar los objetivos de este mes. Recargá para reintentar.':'Cargando objetivos…'}</div></div>`;
    return barraObjetivoMes(mes,estado.datos);
  }).join('');
}
function barraObjetivoTiendanube(data,range){
  const meses=mesesEntre(new Date(range.from+'T00:00:00Z'),new Date(range.to+'T00:00:00Z'));
  let pending=false, failed=false;
  const cards=meses.map(mes=>{
    const estado=estadoObjetivoMes(mes);
    if(estado.cargando){pending=true;return '';}
    if(estado.error){failed=true;return '';}
    const objetivo=Number(estado.datos?.tiendanube)||0;
    if(!objetivo)return '';
    const dias=data.daily.filter(d=>d.date?.slice(0,7)===mes);
    const incompletos=dias.reduce((n,d)=>n+(Number(d.missingAmounts)||0),0);
    const vendido=dias.reduce((n,d)=>n+(Number(d.paidTotalArs)||0),0);
    const detalle=incompletos
      ? `<div class="pmsg">Objetivo: ${montoObjetivo(objetivo,mes)}. Hay ${n0(incompletos)} pedidos pagados sin importe completo en ARS; no se calcula un cumplimiento parcial.</div>`
      : barraCumpl('Pedidos pagados de Tienda Nube',vendido,objetivo,mes);
    return `<div class="card" style="margin-bottom:12px"><h3>Objetivo Tienda Nube · ${mesLegible(mes)}</h3>${detalle}<div class="pmsg">${notaObjetivo(mes)} ${data.stale?'Las ventas corresponden a la última consulta válida.':''}</div></div>`;
  }).filter(Boolean);
  if(cards.length)return cards.join('');
  if(pending||failed)return `<div class="card" style="margin-bottom:12px"><h3>Objetivo Tienda Nube</h3><div class="pmsg">${failed?'No pudimos cargar los objetivos. Recargá para reintentar.':'Cargando objetivos…'}</div></div>`;
  return '<div class="card" style="margin-bottom:12px"><h3>Objetivo Tienda Nube</h3><div class="pmsg">Todavía no hay un objetivo para el período. Dirección puede cargarlo en Configuración.</div></div>';
}
function barraObjetivoTnGeneral(mes,objetivo){
  if(F.can!==''||F.ven!==''||!esDireccion())return '';
  if(!objetivo)return mes===mesHoy()?'<div class="pmsg"><b>Tienda Nube</b> · Sin objetivo cargado. Dirección puede fijarlo en Configuración.</div>':'';
  const range={from:offToIso(F.from===null?MINOFF:F.from),to:offToIso(F.to===null?TODAY:F.to)};
  const key=range.from+'|'+range.to;
  if(TN.key!==key&&!TN.pending)queueMicrotask(()=>cargarTiendanube(false,range));
  const rot='<b>Tienda Nube</b> <span style="color:var(--text-muted)">· pedidos pagados</span>';
  if(TN.key!==key||TN.pending)return `<div class="objbar"><div class="pmsg">${rot} · Consultando ventas de Tienda Nube…</div></div>`;
  if(TN.error||!TN.data?.configured)return `<div class="objbar"><div class="pmsg">${rot} · No pudimos consultar sus ventas. Abrí el canal Tienda Nube y tocá Actualizar.</div></div>`;
  const dias=TN.data.daily.filter(d=>d.date?.slice(0,7)===mes);
  const incompletos=dias.reduce((n,d)=>n+(Number(d.missingAmounts)||0),0);
  if(incompletos)return `<div class="objbar"><div class="pmsg">${rot} · Objetivo ${montoObjetivo(objetivo,mes)}. Hay ${n0(incompletos)} pedidos pagados sin importe completo en ARS; no se calcula un cumplimiento parcial.</div></div>`;
  const vendido=dias.reduce((n,d)=>n+(Number(d.paidTotalArs)||0),0);
  return barraCumpl(rot,vendido,objetivo,mes)+(TN.data.stale?'<div class="pmsg">Tienda Nube: ventas de la última consulta válida.</div>':'');
}
function barraObjetivoMes(mesKey,OBJETIVO){
  const mes=mesLegible(mesKey);
  const ventas=i=>ventasDelMes(i,mesKey), barra=(rot,v,o)=>barraCumpl(rot,v,o,mesKey), nota=()=>notaObjetivo(mesKey);
  if(esVendedora()){
    if(!OBJETIVO.mio) return '';
    return `<div class="card" style="margin-bottom:12px"><h3>Tu objetivo de ${mes}</h3>${
      barra('Tus ventas del mes',ventas(0),OBJETIVO.mio)}<div class="pmsg">${nota()}</div></div>`;
  }
  if(!esDireccion()) return '';
  const porVen=Object.keys(OBJETIVO.vendedoras||{}).filter(k=>OBJETIVO.vendedoras[k]>0);
  if(!OBJETIVO.empresa&&!porVen.length&&!OBJETIVO.tiendanube) return '';
  const d=RAW.dict||{};
  /* Dirección filtrando una persona ve sólo su objetivo. Sin filtro conserva el consolidado. */
  if(F.ven!==''){
    const i=Number(F.ven), nom=(d.VEN||[])[i], objetivo=OBJETIVO.vendedoras[nom]||0;
    if(!objetivo) return '';
    return `<div class="card" style="margin-bottom:12px"><h3>Objetivo de ${nom} · ${mes}</h3>${
      barra(nom,ventas(i),objetivo)}<div style="font-size:11px;color:var(--text-muted);margin-top:8px">${nota()}</div></div>`;
  }
  const detalle=porVen.map(nom=>{
    const i=(d.VEN||[]).indexOf(nom);
    return barra(nom,i<0?0:ventas(i),OBJETIVO.vendedoras[nom]);
  }).join('');
  const tienda=barraObjetivoTnGeneral(mesKey,OBJETIVO.tiendanube);
  return `<div class="card" style="margin-bottom:12px"><h3>Objetivo de ${mes}</h3>${
    OBJETIVO.empresa?barra('<b>Toda la empresa</b>',ventas(null),OBJETIVO.empresa):''}${
    detalle?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">${detalle}</div>`:''}${
    tienda?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">${tienda}</div>`:''}
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">${nota()} Tienda Nube usa pedidos pagados de su propia API y no se suma otra vez a las ventas de Odoo. Se cargan desde <b>Configuración</b>.</div></div>`;
}

/* ===== CONFIGURACIÓN (sólo Dirección) =====================================================
   Dos cosas en una pantalla: los accesos del equipo y los objetivos del mes. Están juntas
   porque se tocan en el mismo momento —cuando entra o sale alguien, y cuando arranca el mes—
   y separarlas obligaría a acordarse de dos lugares. */
let CFG={usuarios:null,mes:'',objetivos:null,cargando:false};

const mesLegible=m=>{const p=String(m).split('-');return p.length===2?MES[+p[1]-1]+' '+p[0]:m;};
function mesHoy(){ return BUSINESS_TODAY.slice(0,7); }
/* Conservar el historial desde 2026 (o antes, si hay datos), incluso al cambiar de año
   o si el dataset se recorta. Incluir meses sin ventas y los tres próximos. */
function mesesCargables(){
  const hoy=mesHoy(), meta=RAW.meta||{};
  const inicio=['2026-01',hoy,CFG.mes,meta.day0,meta.dateFrom,...(RAW.dict.MON||[])]
    .filter(Boolean).map(m=>String(m).slice(0,7))
    .filter(m=>/^\d{4}-(0[1-9]|1[0-2])$/.test(m)).sort()[0];
  const [y,m]=hoy.split('-').map(Number), [iy,im]=inicio.split('-').map(Number), out=[];
  for(let i=iy*12+im-1;i<=y*12+m-1+3;i++){
    out.push(new Date(Date.UTC(Math.floor(i/12),i%12,1)).toISOString().slice(0,7));
  }
  return out;
}

async function cargarConfig(mes){
  CFG.cargando=true; go();
  const [u,o]=await Promise.all([api('usuarios',{token:USER.token}),api('objetivos',{token:USER.token,mes})]);
  if(u&&u.code==='sesion'){ sesionBorrar(); location.reload(); return; }
  CFG.usuarios=(u&&u.usuarios)||[];
  CFG.mes=(o&&o.mes)||mes;
  CFG.objetivos=(o&&o.objetivos)||{empresa:0,tiendanube:0,vendedoras:{}};
  if(o&&o.ok) OBJETIVOS_MES.set(CFG.mes,{datos:{...CFG.objetivos,vendedoras:{...CFG.objetivos.vendedoras}}});
  CFG.cargando=false; go();
}

      <label for="cfgMes">Mes</label>
      <select class="ctl" id="cfgMes">${mesesCargables().map(m=>
        `<option value="${m}"${m===CFG.mes?' selected':''}>${mesLegible(m)}</option>`).join('')}</select>
    </div>
    <div id="objForm">${filaObj('empresa','<b>Toda la empresa</b>')}
      <div style="height:1px;background:var(--border);margin:12px 0"></div>
      ${vend.map(u=>filaObj(u.vendedora,u.nombre)).join('')}
      <div style="height:1px;background:var(--border);margin:12px 0"></div>
      ${filaObj('__tiendanube__','<b>Tienda Nube</b> · canal de venta')}
      <div class="pmsg">Este objetivo es independiente del objetivo personal de Yeni. Se mide con los pedidos pagados de Tienda Nube, no con ventas a nombre de Yeni en Odoo.</div></div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
      <button class="btn" id="objSave" type="button" ${!tipoCambio?'disabled':''}>Guardar objetivos</button>
      <span id="objMsg" style="font-size:12px;color:var(--text-muted)"></span></div></div>`));

  document.getElementById('cfgMes').addEventListener('change',e=>cargarConfig(e.target.value));
  [...document.querySelectorAll('#objForm input')].forEach(i=>i.addEventListener('input',()=>{
    const v=Number(i.value)||0;
    const ars=Math.round(v*tipoCambio*100)/100;
    if(i.dataset.alcance==='empresa') CFG.objetivos.empresa=ars;
    else if(i.dataset.alcance==='__tiendanube__') CFG.objetivos.tiendanube=ars;
    else CFG.objetivos.vendedoras[i.dataset.alcance]=ars;
    document.getElementById(i.id+'_h').textContent=v?moneyFull(v):'sin objetivo';
  }));
  document.getElementById('objSave').addEventListener('click',async()=>{
    const b=document.getElementById('objSave'), msg=document.getElementById('objMsg');
    b.disabled=true; msg.textContent='Guardando…';
    const filas=[...document.querySelectorAll('#objForm input')].map(i=>
      ({alcance:i.dataset.alcance,objetivo:val(i.dataset.alcance)}));
    let r;
    try{ r=await api('guardarObjetivos',{token:USER.token,mes:CFG.mes,filas}); }
    catch(err){ r={ok:false,error:'No pudimos conectarnos con el servidor.'}; }
    b.disabled=false;
    msg.textContent=r&&r.ok?'Guardado y verificado.':('No se pudo guardar. '+((r&&r.error)||''));
    if(r&&r.ok){
      // Usamos lo que el servidor releyó, no los valores todavía presentes en pantalla.
      CFG.objetivos=r.objetivos||{empresa:0,tiendanube:0,vendedoras:{}};
      OBJETIVOS_MES.set(CFG.mes,{datos:{...CFG.objetivos,vendedoras:{...CFG.objetivos.vendedoras}}});
      // Si se cambió el objetivo del mes en curso, el tablero tiene que reflejarlo al volver.
      if(CFG.mes===mesHoy()){
        OBJETIVO.empresa=CFG.objetivos.empresa;
        OBJETIVO.tiendanube=CFG.objetivos.tiendanube;
        OBJETIVO.vendedoras={...CFG.objetivos.vendedoras};
      }
    }
  });

  /* --- accesos --- */
  const filaU=u=>`<tr>
      <td><b>${u.nombre}</b><div style="font-size:11px;color:var(--text-muted)">${u.usuario}${u.vendedora?' · '+u.vendedora:''}</div></td>
      <td>${u.rol==='direccion'?'Dirección':'Vendedora'}</td>
      <td>${u.ultimoIngreso||'<span style="color:var(--text-muted)">nunca entró</span>'}
          ${u.debeCambiar?'<div style="font-size:11px;color:var(--text-warning,#8a6a1f)">tiene la clave inicial</div>':''}</td>
      <td style="white-space:nowrap">
        <button class="btn btn--quiet" data-acc="reset" data-u="${u.usuario}" type="button">Resetear clave</button>
        <button class="btn btn--quiet" data-acc="${u.activo?'baja':'alta'}" data-u="${u.usuario}" type="button">${u.activo?'Desactivar':'Reactivar'}</button>
      </td></tr>`;
  const cardAcc=el(`<div class="card" style="margin-top:12px"><h3>Accesos</h3>
    <div class="pmsg" style="margin-bottom:12px">Resetear una clave la vuelve a la inicial y obliga a cambiarla en el próximo ingreso. Desactivar no borra nada: la persona deja de entrar pero queda el registro.</div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Persona</th><th>Rol</th><th>Último ingreso</th><th></th></tr></thead>
      <tbody>${CFG.usuarios.filter(u=>u.activo).map(filaU).join('')}
      ${CFG.usuarios.some(u=>!u.activo)?`<tr><td colspan="4" style="padding-top:14px;color:var(--text-muted);font-size:12px">Desactivados</td></tr>`+CFG.usuarios.filter(u=>!u.activo).map(filaU).join(''):''}</tbody></table></div>
    <div id="accMsg" style="font-size:12px;color:var(--text-muted);margin-top:10px"></div></div>`);
  A.appendChild(cardAcc);
  cardAcc.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-acc]'); if(!b) return;
    const msg=document.getElementById('accMsg'), acc=b.dataset.acc, u=b.dataset.u;
    if(acc==='reset'&&!confirm('¿Resetear la clave de '+u+' a la inicial?')) return;
    b.disabled=true; msg.textContent='…';
    const r=acc==='reset' ? await api('reset',{token:USER.token,usuario:u})
                          : await api('baja',{token:USER.token,usuario:u,activo:acc==='alta'});
    if(r&&r.ok){
      msg.textContent=acc==='reset'?('Listo. La clave de '+u+' quedó en: '+r.clave):'Listo.';
      cargarConfig(CFG.mes);
    } else { b.disabled=false; msg.textContent=(r&&r.error)||'No se pudo.'; }
  });

  /* --- alta --- */
  A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Sumar una persona</h3>
    <div class="altaform">
      <div class="ofila"><label for="nu">Usuario</label><input class="ctl" id="nu" placeholder="inicial + apellido"></div>
      <div class="ofila"><label for="nn">Nombre</label><input class="ctl" id="nn" placeholder="Nombre y apellido"></div>
      <div class="ofila"><label for="nr">Rol</label><select class="ctl" id="nr"><option value="vendedora">Vendedora</option><option value="direccion">Dirección</option></select></div>
      <div class="ofila"><label for="nv">Nombre en Odoo</label><input class="ctl" id="nv" placeholder="tal cual figura en Odoo"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button class="btn" id="altaBtn" type="button">Dar de alta</button>
      <span id="altaMsg" style="font-size:12px;color:var(--text-muted)"></span></div></div>`));

  document.getElementById('altaBtn').addEventListener('click',async()=>{
    const g=id=>document.getElementById(id).value.trim();
    const msg=document.getElementById('altaMsg');
    msg.textContent='…';
    const r=await api('alta',{token:USER.token,usuario:g('nu').toLowerCase(),nombre:g('nn'),
                              rol:g('nr'),vendedora:g('nv')});
    if(r&&r.ok){ msg.textContent='Listo. Entra con la clave '+r.clave+' y la tiene que cambiar.';
                 ['nu','nn','nv'].forEach(i=>document.getElementById(i).value='');
                 cargarConfig(CFG.mes); }
    else msg.textContent=(r&&r.error)||'No se pudo dar de alta.';
  });
}

function render(A,D,PREV){
  const d=RAW.dict;
  syncState('Odoo · '+RAW.pull+(rate?(' · dólar oficial $'+n0(rate)+(RAW.usdFecha?' al '+fmtFecha(RAW.usdFecha):'')):''),'ok');

  /* Barra de contexto: qué período y qué filtros están activos. Va en el contenido (no en la
     toolbar) para que salga también en el PDF, donde la toolbar se oculta. */
  const chips=['Fuente: <b>Odoo</b>'];
  if(F.ven!=='') chips.push('Vendedora: <b>'+d.VEN[Number(F.ven)]+'</b>');
  if(F.can!=='') chips.push('Canal: <b>'+d.CAN[Number(F.can)]+'</b>');
  A.appendChild(el(`<div class="periodbar">${ICO.cal}<span><b>${rangeLabel()}</b>${chips.length?' · '+chips.join(' · '):''}</span></div>`));

  /* Cada mes del período usa su propia meta y las ventas que pasan los filtros. */
  const barra=barraObjetivo();
  if(barra) A.appendChild(el(barra));

  if(D.nord===0){
    A.appendChild(el('<div class="card"><h3>Sin ventas en este período</h3><div class="pmsg">No hay órdenes confirmadas para el filtro elegido. Probá elegir <b>Mes anterior</b> o ampliar el rango de fechas.</div></div>'));
    renderCRM(A,D);
    return;
  }

  /* USD: si no hay cotización oficial para NINGÚN mes del filtro, no inventamos un número — avisamos */
  const usdPend=D.usdBlocked;
  const M=v=>usdPend?'🚧 en construcción':money(v);
  const MF=v=>usdPend?'🚧 en construcción':moneyFull(v);

  let curTag='';
  if(CUR==='USD'){
    curTag=usdPend
      ? ' <span class="bdg" style="background:var(--bg-warning);color:var(--text-warning)">🚧 sin cotización oficial para este filtro</span>'
      : ' <span class="bdg" style="background:var(--bg-accent);color:var(--text-accent)">USD al oficial del día de cada venta</span>';
  }

  /* KPIs con su variación contra el período de comparación (ver prevRange). Sin período elegido
     —"Todo el período"— no hay contra qué medir y las tarjetas salen sin badge. */
  const tk=D.nord?D.ventas/D.nord:0, tkP=PREV&&PREV.nord?PREV.ventas/PREV.nord:0;
  const cmpT=PREV?'vs '+prevLabel():'';
  const crmVista=contextoCRM();
  const CEtop=D.crmEstado, cerrTop=CEtop.cerradas;
  const SC=[
   {l:'Ventas confirmadas',v:M(D.ventas),      s:n0(D.nord)+' órdenes',  a:D.ventas,     b:PREV&&PREV.ventas},
   {l:'Ticket promedio',   v:MF(tk),           s:'por orden',            a:tk,           b:tkP},
   {l:'Órdenes',           v:n0(D.nord),       s:'confirmadas',          a:D.nord,       b:PREV&&PREV.nord},
   {l:'Prendas vendidas',  v:n0(D.prTot),      s:'unidades',             a:D.prTot,      b:PREV&&PREV.prTot},
  ];
  if(F.can===String(d.CAN.indexOf('Venta directa'))||F.ven!==''||esVendedora()){
    const avg=D.nord?D.prTot/D.nord:0,prevAvg=PREV&&PREV.nord?PREV.prTot/PREV.nord:0;
    SC.push({l:'Prendas promedio por orden',v:avg.toLocaleString('es-AR',{maximumFractionDigits:2}),
      s:'prendas / órdenes confirmadas',a:avg,b:PREV&&prevAvg});
  }
  if(crmVista.principal) SC.push(
    {l:'% de cierres ganados',v:cerrTop?porcentajeCierres(CEtop.ganadas,cerrTop):CEtop.sinEstado?'Sin cierres identificados':'Sin cierres',
      s:cerrTop?n0(CEtop.ganadas)+' ganadas / ('+n0(CEtop.ganadas)+' ganadas + '+n0(CEtop.perdidas)+' perdidas)':'Sin oportunidades cerradas identificadas en el período',
      ayuda:'Calculado por fecha de cierre; si falta, se usa la fecha de alta como referencia. '+notaCalidadCRM(CEtop)},
    {l:'Ganadas por cierre',v:n0(CEtop.ganadas),s:CEtop.sinFechaCierre?'CRM · cierre o alta como referencia':'CRM · cierre dentro del período'}
  );
  A.appendChild(el('<div class="kpis">'+SC.map(k=>
   `<div class="kpi"><div class="kl">${k.l}${k.ayuda?'<span tabindex="0" role="img" aria-label="'+k.ayuda+'" title="'+k.ayuda+'" style="margin-left:5px;cursor:help">ⓘ</span>':''}</div><div class="kv">${k.v}</div><div class="ks">${k.s}</div>`
   +(PREV&&k.a!==undefined&&!usdPend?dltBadge(k.a,k.b,cmpT):'')+'</div>').join('')+'</div>'));
  if(PREV) A.appendChild(el(`<div class="cmpnote" style="margin:-2px 2px 10px">Las variaciones comparan contra ${prevLabel()}.</div>`));
  if(CUR==='USD' && D.usdMissingMonths.length){
    const lbl=D.usdMissingMonths.map(monFull).join(', ');
    A.appendChild(el(`<div class="card pend" style="margin-bottom:14px;padding:10px 14px"><div class="pmsg">🚧 <b>En construcción:</b> todavía no hay cotización oficial promedio para ${lbl}. Esos meses quedan afuera de los totales en USD hasta que se cargue.</div></div>`));
  }

  /* Acá iba el cartel de "órdenes anuladas por nota de crédito". Se sacó el 04/09/2026 junto con
     la exclusión que lo generaba: el criterio ahora es que una venta caída se cancela en Odoo. */

  /* 1·2 — el rótulo dice "ventas confirmadas" y no "facturación" a propósito: el dato sale de las
     órdenes de venta cerradas en Odoo (criterio comercial, imputado a la fecha en que se vendió),
     no del módulo de facturación. Decirle "facturación" fue lo que hizo dudar del número. */
  sec(A,'Ventas confirmadas — evolución mensual'+curTag);
  const evoChart=chartSVG(D.meses.map(x=>({lbl:x.m,v:x.ventas,n:x.nv,noRate:x.noRate})),
    {line:true,delta:true,fmt:M,h:265,aria:'Ventas confirmadas y cantidad de órdenes por mes, con variación mensual'});
  A.appendChild(el(`<div class="card"><h3>Evolución mensual — ventas y órdenes de compra</h3>${evoChart}
    ${legendHTML([{c:'var(--fill-primary)',t:'Ventas confirmadas (eje izquierdo)'},{c:SERIE2,t:'Órdenes de compra (eje derecho)',line:1}])}
    <div class="cmpnote">Bajo cada mes, la variación del monto contra el mes anterior. Monto con IVA incluido de las órdenes confirmadas en Odoo, imputado a la fecha de la venta. La extracción de ventas comienza el ${fmtFecha(offToIso(MINOFF))}; desde allí los meses sin órdenes se muestran en cero.</div></div>`));

  if(esVendedora()){
    A.appendChild(el(`<div class="card" style="margin-top:12px">${evoTable(D.evo.lbl,D.evo.vendedora,M,{total:false})}</div>`));
  }
  renderCRM(A,D);

  /* 3 — el donut se arma desde d.TIPO, así que sigue a la cantidad de tipos que traiga el dataset
     (desde el 04/09/2026 son tres: Tradicional, Pronta Entrega y Ecommerce). */
  const TIPOS=(RAW.dict.TIPO||[]).map((n,i)=>({n,u:D.prT[i]||0,o:D.oT[i]||0,
    c:{'Tradicional':'#1e3a6e','Pronta Entrega':'#7fa3d9','Ecommerce':'#4a6da8'}[n]||'#a9b6c9'}))
    .filter(t=>t.u||t.o);
  sec(A,'Prendas vendidas — por tipo de orden');
  const tp=D.prTot;
  let acum=0;
  const tramos=TIPOS.map(t=>{const desde=tp?acum/tp*100:0; acum+=t.u; const hasta=tp?acum/tp*100:0;
    return `${t.c} ${desde.toFixed(2)}% ${hasta.toFixed(2)}%`;}).join(',');
  const dpr=`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="donut3" style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${tramos||'#a9b6c9 0 100%'});position:relative">
     <div style="position:absolute;inset:24px;background:var(--surface-2);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600">${n0(tp)}<span style="font-size:9px;color:var(--text-muted);font-weight:400">prendas</span></div></div>
    <div style="font-size:12.5px">${TIPOS.map(t=>
      `<div style="margin-bottom:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${t.c}"></span> ${t.n}: <b>${n0(t.u)} u</b> (${tp?Math.round(100*t.u/tp):0}%)</div>`
     ).join('')}</div></div>`;
  const dpr2=`<b>${n0(tp)} prendas</b> en total. Órdenes: ${TIPOS.map(t=>t.n+' '+n0(t.o)).join(' · ')}. Entregadas hasta hoy: <b>${n0(D.ent)} u</b> — el resto está pendiente de entrega.`;
  row2(A,'Prendas por tipo de orden',dpr,'Lectura','<div class="pmsg">'+dpr2+'</div>',1);
  A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Evolución mes a mes — prendas y órdenes por tipo</h3>
    ${evoTable(D.evo.lbl,D.evo.tipoPrendas,n0)}
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <h3>Órdenes por tipo</h3>${evoTable(D.evo.lbl,D.evo.tipoOrdenes,n0)}</div></div>`));

  /* 4 */
  if(!esVendedora()&&D.yoy&&D.yoy.length>=2){
    sec(A,'Comparación entre años');
    const mxy=Math.max(...D.yoy.map(x=>x.v),1);
    const yh=D.yoy.map(x=>hb(x.y,x.v/mxy*100,M(x.v)+' · '+n0(x.n)+' órd.')).join('');
    const first=D.yoy[0], last=D.yoy[D.yoy.length-1];
    const delta=first.v?Math.round(100*(last.v-first.v)/first.v):0;
    A.appendChild(el(`<div class="card"><h3>Comparativo interanual</h3>${yh}<div style="font-size:11px;color:var(--text-muted);margin-top:8px">Variación ${last.y} vs ${first.y}: <b style="color:${delta>=0?'var(--text-success)':'var(--text-danger)'}">${delta>=0?'+':''}${delta}%</b></div></div>`));
  }

  /* Ranking exclusivo de Dirección. El detalle mensual individual está bajo el primer gráfico. */
  if(veComparativaEntreVendedoras()){
    sec(A,'Ventas por vendedora');
    const mxv=D.vend[0]?D.vend[0].monto:1;
    const vh=D.vend.map(x=>hb(x.n,x.monto/mxv*100,M(x.monto)+' · '+n0(x.ops)+' órd.')).join('');
    A.appendChild(el(`<div class="card"><h3>Ranking por vendedora</h3>${vh}<div style="font-size:11px;color:var(--text-muted);margin-top:8px">Sólo vendedoras. Las ventas web registradas en Odoo están incluidas en el total general y en Ventas por canal.</div></div>`));
    A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Evolución mes a mes por vendedora</h3>${evoTable(D.evo.lbl,D.evo.vendedora,M)}</div>`));
  }

  /* 6 — fuera del tablero individual (pedido de Ariel, 04/09/2026): las vendedoras venden sólo
     por venta directa, así que el comparativo por canal no les dice nada. La sección desaparece
     entera, sin cartel, igual que se hace con el ranking en la vista Ventas. */
  if(!esVendedora()){
    sec(A,'Ventas por canal');
    const totM=D.web.m+D.pres.m||1, totO=D.web.n+D.pres.n||1;
    const cr=(nm,dd,col)=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${nm}</span><b>${M(dd.m)} · ${n0(dd.n)} órd.</b></div>
      <div style="background:var(--surface-1);border-radius:4px;height:10px"><div style="width:${(dd.m/totM*100).toFixed(1)}%;height:10px;border-radius:4px;background:${col};opacity:.8"></div></div>
      <div style="font-size:10.5px;color:var(--text-muted);margin-top:3px">${Math.round(dd.m/totM*100)}% del monto · ${Math.round(dd.n/totO*100)}% de las órdenes</div></div>`;
    A.appendChild(el(`<div class="card"><h3>Venta directa vs Web</h3>${cr('Venta directa',D.pres,'#1e3a6e')+cr('Web (Tiendanube)',D.web,'#7fa3d9')}</div>`));
    A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Evolución mes a mes por canal${curTag}</h3>
      ${evoTable(D.evo.lbl,D.evo.canalMonto,M)}
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
        <h3>Órdenes por canal</h3>${evoTable(D.evo.lbl,D.evo.canalOrd,n0)}</div></div>`));
  }

  /* 7 */
  sec(A,'Ticket promedio — evolución');
  const th=chartSVG(D.meses.map(x=>({lbl:x.m,v:x.nv?x.ventas/x.nv:0,noRate:x.noRate})),
    {fmt:M,delta:true,h:225,barColor:'#4a6da8',aria:'Ticket promedio por mes, con variación mensual'});
  A.appendChild(el(`<div class="card"><h3>Ticket promedio por mes</h3>${th}<div style="font-size:11px;color:var(--text-muted);margin-top:6px">Global del filtro ${MF(tk)}`
    +(PREV&&!usdPend?' '+dltBadge(tk,tkP,cmpT):'')+`</div></div>`));

  /* Pedido nuevo vs reposición: sólo en esta sección, como pidió Ariel. */
  if(D.ticketPedido&&D.ticketPedido.series.length){
    const TP=D.ticketPedido;
    const tarjeta=(rot,d,col)=>`<div style="flex:1 1 160px;min-width:0">
        <div style="font-size:11.5px;color:var(--text-muted)"><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${col};margin-right:5px"></span>${rot}</div>
        <div style="font-size:19px;font-weight:600;margin-top:2px">${MF(d.tk)}</div>
        <div style="font-size:11px;color:var(--text-muted)">${n0(d.n)} ${d.n===1?'orden':'órdenes'}</div></div>`;
    A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Ticket promedio — pedido nuevo vs reposición${curTag}</h3>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px">
        ${tarjeta('Pedido nuevo',TP.nuevo,'#1e3a6e')}${tarjeta('Reposición',TP.repo,'#7fa3d9')}</div>
      ${evoTable(D.evo.lbl,TP.series,MF,{total:false})}
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Es <b>pedido nuevo</b> cuando el cliente se dio de alta en Odoo el mismo mes de la venta; si ya era cliente, es <b>reposición</b>. Los valores son promedios por orden, no totales.</div></div>`));
  }

  /* 9 */
  sec(A,'Ventas por provincia');
  const provinciaNoMuted=D.provincia.filter(x=>!x.muted);
  const mxp=Math.max(...provinciaNoMuted.map(x=>x.v),1);
  const gh=D.provincia.map(x=>hb(x.n,x.v/mxp*100,M(x.v),{muted:x.muted,color:x.muted?'#c3ccd6':'#1e3a6e'})).join('');
  A.appendChild(el(`<div class="card"><h3>Ventas por provincia</h3>${gh}</div>`));
  A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Evolución mes a mes — 6 provincias principales${curTag}</h3>
    ${evoTable(D.evo.lbl,D.evo.provincia,M)}
    <div class="cmpnote">El total de estas filas no es el total del período: quedan afuera las provincias fuera del top 6 y los clientes sin provincia cargada.</div></div>`));
  if(!esVendedora()&&F.can===String(RAW.dict.CAN.indexOf('Venta directa'))){
    sec(A,'Ventas por segmento y provincia');
    const segmentos=['Administración','Laboral','Sanidad','Otros / Accesorios'];
    const amount=v=>v===null?'Sin cotización':M(v||0);
    const body=(D.segmentoProv||[]).map(r=>`<tr><td>${tnEscape(r.provincia)}</td>`
      +segmentos.map(s=>`<td>${amount(r.valores[s])}</td>`).join('')+`<td>${amount(r.total)}</td></tr>`).join('');
    A.appendChild(el(`<div class="card"><h3>Venta directa por segmento de producto y provincia</h3>`
      +(D.segmentoProv===null?'<div class="pmsg">El desglose por provincia se completa con la próxima sincronización de Odoo.</div>'
        :body?`<div class="evo"><table><thead><tr><th>Provincia</th>${segmentos.map(s=>`<th>${s}</th>`).join('')}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div>`
          :'<div class="pmsg">Sin prendas de los segmentos identificados en este período.</div>')
      +'<div class="cmpnote">Importes con IVA de las líneas de productos del canal Venta directa; se excluyen gastos, insumos y categorías sin prenda. La provincia sale del cliente de cada orden.</div></div>'));
  }

  /* 11 */
  sec(A,'Ventas por tipo de producto');
  const bh=D.buckets.map(x=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${x.n}</span><b>${M(x.v)} · ${x.p}%</b></div>
    <div style="background:var(--surface-1);border-radius:4px;height:11px"><div style="width:${x.p}%;height:11px;border-radius:4px;background:${x.c}"></div></div></div>`).join('')
    +`<div style="margin-top:6px;padding-top:9px;border-top:1px dashed var(--border)">
       <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;color:var(--text-muted)"><span>${D.sinCategorizar.n}</span><b>${M(D.sinCategorizar.v)} · ${D.sinCategorizar.p}%</b></div>
       <div style="background:var(--surface-1);border-radius:4px;height:11px"><div style="width:${Math.max(2,D.sinCategorizar.p)}%;height:11px;border-radius:4px;background:#c3ccd6"></div></div>
       <div style="font-size:10.5px;color:var(--text-muted);margin-top:3px">No es prenda (gastos, insumos, telas, ítems a depurar): fuera de los 3 segmentos de producto.</div>
     </div>`;
  const mxc=Math.max(...D.cat.map(x=>x.v),1);
  const ch=D.cat.map(x=>hb(x.n,x.v/mxc*100,M(x.v)+' · '+x.p+'%',{color:'#4a6da8'})).join('');
  row2(A,'Por segmento (mapeo)',bh,
    'Categorías reales de Odoo',ch,1);
  A.appendChild(el(`<div class="card" style="margin-top:12px"><h3>Evolución mes a mes por segmento${curTag}</h3>
    ${evoTable(D.evo.lbl,D.evo.segmento,M)}</div>`));

  const usdFootNote = CUR==='USD'
    ? (usdPend ? ' Sin cotización oficial disponible para este filtro: los montos en USD no están completos.'
       : ' Convertidos a USD al dólar oficial del día de cada venta (no un tipo de cambio único): si ese día no hubo publicación —finde o feriado— se arrastra el último, y si falta el día se usa el promedio del mes.')
    : ' Están en pesos (ARS); usá el switch ARS/USD arriba.';
  A.appendChild(el(`<div style="font-size:11px;color:var(--text-muted);margin-top:24px">Datos de Odoo por API · ${RAW.pull} · se actualiza solo cada 30 min · dólar oficial ${RAW.usdFuente}${RAW.usdFecha?' ('+RAW.usdFecha+')':''} · montos con IVA incluido.${usdFootNote}</div>`));
}

function renderCRM(A,D){
  const vista=contextoCRM();
  if(vista.web) return;
  if(!vista.visible){
    A.appendChild(el('<div class="card"><div class="pmsg">Para consultar las oportunidades del CRM, seleccioná «Todos» en Canal. Podés mantener el filtro de vendedora.</div></div>'));
    return;
  }
  const flujo=D.flujoCRM;
  sec(A,'Flujo de oportunidades creadas — etapa actual');
  const grupos=agruparEtapasCRM(flujo.etapas).concat([{n:'Perdidas',v:flujo.perdidas,etapas:[]}]);
  const tarjetas=grupos.map(x=>`<div class="kpi"><div class="kl">${x.n}</div><div class="kv">${n0(x.v)}</div><div class="ks porcentaje-flujo">${flujo.total?(100*x.v/flujo.total).toLocaleString('es-AR',{maximumFractionDigits:1})+'% del flujo creado':'Sin oportunidades'}</div><div class="ks">${x.etapas.length>1?x.etapas.map(e=>e.n+': '+n0(e.v)).join('<br>'):x.n==='Perdidas'?'Archivadas sin ganar':'oportunidades'}</div></div>`).join('');
  const nota=flujo.compatibilidad
    ? 'La próxima sincronización completará la identificación de archivadas. Mientras tanto se usa la clasificación disponible.'
    : (flujo.archivadasFuera?n0(flujo.archivadasFuera)+' oportunidades archivadas fuera de estas categorías. ':'')+'Perdidas son las archivadas sin ganar. No avanzará conserva su etapa. Los leads no se incluyen.';
  A.appendChild(el(`<div class="card crm-flujo"><h3>${n0(flujo.total)} oportunidades creadas en el período</h3>
    <div class="pmsg" style="margin-bottom:12px">Cada tarjeta muestra la etapa actual de esas oportunidades. Este porcentaje describe el flujo creado; <b>no es la tasa de cierres ganados</b>. <span tabindex="0" role="img" aria-label="${nota}" title="${nota}" style="cursor:help">ⓘ</span></div>
    <div class="kpis crm-flow-cards">${tarjetas}</div>
    ${flujo.total?'':'<div class="pmsg">Sin oportunidades creadas en este período.</div>'}
    ${vista.principal?renderConciliacionCRM(D):''}
  </div>`));
  if(veComparativaEntreVendedoras()&&F.ven==='') renderComparativaCRM(A,D);
}

function renderConciliacionCRM(D){
  const R=D.crmReconciliation;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fecha=dia=>Number.isFinite(dia)&&dia>=0?fmtDay(dia):'sin fecha';
  const orden=o=>'Orden '+(o.id?'#'+n0(o.id):'(sin ID)')+' · '+fecha(o.dia);
  const oportunidad=o=>'Oportunidad #'+n0(o.id)+' · '+fecha(o.dia);
  const bloque=(titulo,items)=>items.length
    ? `<div class="crm-recon-list"><b>${titulo}:</b><br>${items.join('<br>')}</div>`:'';
  const sinOportunidad=R.sinOportunidad.map(o=>esc(orden(o)));
  const noGanadas=R.vinculadasNoGanadas.map(o=>esc(orden(o))+' → oportunidad #'+n0(o.oportunidad)
    +' · '+esc(o.crm.etapa)+(o.crm.estado===0?' (abierta)':o.crm.estado===2?' (perdida)':' (estado no identificado)'));
  const multiples=R.multiples.map(x=>'Oportunidad #'+n0(x.oportunidad)+' → '
    +x.ordenes.map(o=>esc(orden(o))).join(' + '));
  const sinOrden=R.ganadasSinOrden.map(o=>esc(oportunidad(o)));
  const fuera=R.ganadasVinculadasFuera.map(o=>esc(oportunidad(o)));
  return `<details class="crm-recon">
    <summary>Por qué ${n0(R.ordenes)} órdenes y ${n0(R.ganadas)} ganadas no tienen que coincidir</summary>
    <div class="pmsg">Las órdenes se cuentan por <b>fecha del pedido</b>; las ganadas, por <b>fecha de cierre de la oportunidad</b>. Además, una oportunidad puede tener varias órdenes o ninguna.</div>
    <div class="kpis">
      <div class="kpi"><div class="kl">Órdenes sin oportunidad</div><div class="kv">${n0(R.sinOportunidad.length)}</div><div class="ks">sin vínculo CRM</div></div>
      <div class="kpi"><div class="kl">Órdenes vinculadas a no ganadas</div><div class="kv">${n0(R.vinculadasNoGanadas.length)}</div><div class="ks">abiertas, perdidas o sin estado</div></div>
      <div class="kpi"><div class="kl">Órdenes extra por oportunidad</div><div class="kv">${n0(R.ordenesExtra)}</div><div class="ks">una oportunidad con 2+ órdenes</div></div>
      <div class="kpi"><div class="kl">Ganadas sin orden del período</div><div class="kv">${n0(R.ganadasSinOrden.length)}</div><div class="ks">cierre dentro del rango</div></div>
    </div>
    ${bloque('Órdenes sin oportunidad CRM',sinOportunidad)}
    ${bloque('Órdenes vinculadas a oportunidades no ganadas',noGanadas)}
    ${bloque('Oportunidades con varias órdenes',multiples)}
    ${bloque('Ganadas en el período sin una orden fechada en el mismo rango',sinOrden)}
    ${bloque('Órdenes del período vinculadas a ganadas que cerraron fuera del rango',fuera)}
  </details>`;
}

function renderComparativaCRM(A,D){
  const escapar=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ayuda='Por fecha de cierre; si falta, se usa la fecha de alta como referencia. '+notaCalidadCRM(D.crmEstado);
  const filas=D.convvend.map(x=>`<tr><td>${escapar(x.n)}${x.sinFecha?'<span tabindex="0" role="img" aria-label="'+n0(x.sinFecha)+' cierres con fecha de alta como referencia" title="'+n0(x.sinFecha)+' cierres con fecha de alta como referencia"> ⓘ</span>':''}</td><td>${n0(x.w)}</td><td>${n0(x.t-x.w)}</td><td>${n0(x.t)}</td><td>${porcentajeCierres(x.w,x.t)}</td></tr>`).join('');
  const ganadas=D.convvend.reduce((sum,x)=>sum+x.w,0), cierres=D.convvend.reduce((sum,x)=>sum+x.t,0);
  A.appendChild(el(`<div class="card crm-comparativa" style="margin-top:12px"><h3>Comparativa entre vendedoras</h3>
    <div class="pmsg" style="margin-bottom:12px">Cierres del período · ganadas / (ganadas + perdidas) <span tabindex="0" role="img" aria-label="${ayuda}" title="${ayuda}" style="cursor:help">ⓘ</span></div>
    ${filas?'<div class="evo"><table><thead><tr><th>Vendedora</th><th>Ganadas</th><th>Perdidas</th><th>Cierres</th><th>% ganadas</th></tr></thead><tbody>'+filas+'<tr class="tot"><td>Total vendedoras</td><td>'+n0(ganadas)+'</td><td>'+n0(cierres-ganadas)+'</td><td>'+n0(cierres)+'</td><td>'+porcentajeCierres(ganadas,cierres)+'</td></tr></tbody></table></div>':'<div class="pmsg">Sin vendedoras para comparar.</div>'}
  </div>`));
}

/* ===== arranque (al final: ya están definidas todas las const/función) ===== */
document.getElementById('logout').addEventListener('click',()=>{dataCacheBorrar(USER);sesionBorrar();location.reload();});
document.getElementById('chgpwd').addEventListener('click',async()=>{
  USER=await pedirCambioClave(USER,false); pintarSesion();
});

/* Deja el filtro clavado en la vendedora que inició sesión, ANTES de dibujar nada. El backend ya
   mandó el dataset recortado —el diccionario trae un solo nombre—, así que esto es el cinturón
   además del tirante: si por lo que fuera llegara el dataset entero, el filtro igual la deja
   viendo sólo lo suyo en vez de todo. */
function aplicarRol(){
  if(!esVendedora()) return true;
  const i=((RAW.dict&&RAW.dict.VEN)||[]).indexOf(USER.ven);
  if(i<0) return false;
  F.ven=String(i);
  return true;
}

function pantalla(titulo,texto){
  document.getElementById('app').innerHTML=
    '<div class="card" style="margin-top:20px"><h3>'+titulo+'</h3><div class="pmsg">'+texto+'</div></div>';
}

function arrancar(){
  pintarSesion();
  if(FATAL==='sin_vendedora'){
    return pantalla('No encontramos tus ventas',
      'Tu usuario está asociado a <b>'+((USER&&USER.ven)||'(sin asignar)')+'</b>, que no figura con ese '
      +'nombre exacto entre las vendedoras de Odoo. Avisale a Calcuta para corregirlo.');
  }
  if(FATAL) return pantalla('No se pudieron cargar los datos',FATAL);
  if(!esDireccion()&&(!RAW.O||!RAW.O.length)&&(!RAW.C||!RAW.C.length)){
    return pantalla('Todavía no hay datos',
      esVendedora()?'Todavía no figuran ventas tuyas en el período sincronizado.'
                   :'El servidor todavía no sincronizó con Odoo. Probá recargar en unos minutos.');
  }
  if(!aplicarRol()){
    return pantalla('No encontramos tus ventas',
      'Tu usuario está asociado a <b>'+(USER.ven||'(sin asignar)')+'</b>, que no figura con ese '
      +'nombre exacto entre las vendedoras de Odoo. Avisale a Calcuta para corregirlo.');
  }
  buildToolbar(); go();
}
arrancar();
if(BACKGROUND_REFRESH){
  BACKGROUND_REFRESH.then(fresh=>{
    if(!fresh||!fresh.ok) return;
    dataCacheGuardar(USER,fresh);
    if(VISTA==='tienda')return; // La actualización de Odoo no cambia el estado de la vista TN.
    const newPull=fresh.raw&&fresh.raw.pull;
    if(newPull&&newPull!==RAW.pull) syncState('Hay datos nuevos listos · recargá para verlos','loading');
    else syncState('Odoo · '+RAW.pull,'ok');
  }).catch(()=>{if(VISTA!=='tienda')syncState('Odoo · '+RAW.pull+' · última sincronización','ok');});
}
